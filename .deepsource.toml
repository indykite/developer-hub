# https://docs.deepsource.com/docs/dashboard/repository/.deepsource.toml
version = 1

# Files DeepSource treats as tests: test-only idioms such as `assert` (BAN-B101)
# are not raised for them. Matches the repository's <name>_test.py convention.
test_patterns = ["**/tests/*_test.py", "**/test/*_test.py"]

#
[[analyzers]]
name = "secrets"
enabled = true

#
[[analyzers]]
name = "python"
enabled = true
dependency_file_paths = ["Pipfile"]

  [analyzers.meta]
  runtime_version = "3.x.x"
  max_line_length = 120
  skip_doc_coverage = ["module", "magic", "init", "class", "nonpublic"]

[[transformers]]
name = "ruff" # "black"
enabled = true
