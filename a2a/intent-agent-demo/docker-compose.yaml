---
# intent-agent-demo: the IndyKite Intent Agent, shown end to end.
#
#   console ──(mint persona + actor JWT)──▶ token-service ──▶ delegation token (aud intent_agent)
#   console ──A2A SendMessage, Bearer = delegation──▶ intent-agent ──introspect──▶ token-service
#                                                      │ data schema + policies ──▶ IndyKite platform
#                                                      │ extraction ──▶ Gemini
#                                                      └ audit record ──▶ console (webhook)
#   console ──AuthZEN evaluations/search──▶ IndyKite platform (the decision step)
#
# Build the local images with `make images`; the Intent Agent image comes from
# the public repo (`make intent-agent-image INTENT_AGENT_SRC=...`).

services:
  # Showcase web console: demo issuer (persona/actor JWTs + JWKS), ITS client,
  # A2A client, AuthZEN decision mapper, audit webhook + live stream.
  console:
    image: intent-demo-console:local
    build:
      context: ./console
    # Loopback by default: /api/prompt and the audit endpoints have no caller
    # authentication. Set CONSOLE_BIND=0.0.0.0 in .env to present from another device.
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-3200}:3200"
    environment:
      CONSOLE_PORT: 3200
      LOG_LEVEL: ${CONSOLE_LOG_LEVEL:-INFO}
      INTENT_AGENT_URL: http://${INTENT_AGENT_ENTRY:-intent-agent}:${INTENT_AGENT_PORT:-6003}
      INTENT_AGENT_HEALTH_URL: http://intent-agent:${INTENT_AGENT_HEALTH_PORT:-8001}
      TOKEN_SERVICE_URL: http://token-service:${TOKEN_SERVICE_PORT:-8102}
      TOKEN_SERVICE_CLIENT_ID: intent-demo
      TOKEN_SERVICE_CLIENT_SECRET: ${TOKEN_SERVICE_CLIENT_SECRET}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      APP_AGENT_CREDENTIALS_TOKEN: ${APP_AGENT_CREDENTIALS_TOKEN}
      AUDIT_WEBHOOK_API_KEY: ${AUDIT_WEBHOOK_API_KEY}
      DEMO_IDP_SIGNING_KEY_FILE: /app/keys/demo-idp.key
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      # Demo issuer private key, generated by `make keys` (gitignored).
      - ./console/keys:/app/keys:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:3200/api/health/console', timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # IndyKite Token Service: RFC 8693 exchange + RFC 7662 introspection. Issues
  # the delegation token the console presents to the Intent Agent, and is the
  # agent's INTROSPECT_URL. Official image; linux/amd64 only.
  token-service:
    image: indykite/token-service:1.0.0@sha256:a1248b73ab22fb939e533455a89468b7112b2b938486d8feca818e17776a97e2
    platform: linux/amd64
    # Published for curl-level inspection only, on loopback (see CONSOLE_BIND).
    ports:
      - "${TOKEN_SERVICE_BIND:-127.0.0.1}:${TOKEN_SERVICE_PORT:-8102}:8102"
    volumes:
      # Holds the private signing key + client secret - rendered by `make keys`
      # from token-service.template.yaml, gitignored.
      - ./token-service/token-service.yaml:/app/.configs/token-service.yaml:ro
    command: ["--config=/app/.configs/token-service.yaml"]
    healthcheck:
      test: ["CMD", "/bin/http_health_probe", "http://localhost:8102/.well-known/openid-configuration"]
      interval: 10s
      timeout: 2s
      start_period: 10s
      retries: 5

  # The product under demonstration. Image built from the public intent-agent
  # repo (see INTENT_AGENT_IMAGE in .example.env). Distroless, non-root,
  # nothing writable but /tmp - audit goes to the console webhook.
  intent-agent:
    image: ${INTENT_AGENT_IMAGE:-intent-agent:local}
    expose:
      - "6003"
      - "8001"
    environment:
      LOG_LEVEL: ${INTENT_LOG_LEVEL:-INFO}
      INTENT_PORT: 6003
      HEALTH_PORT: 8001
      ADVERTISED_HOST: intent-agent
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      IK_APP_AGENT_KEY: ${APP_AGENT_CREDENTIALS_TOKEN}
      # RFC 7662 introspection at the Token Service, authenticated with the
      # same client_secret_basic pair the console uses for the exchange.
      INTROSPECT_URL: http://token-service:8102/oauth2/introspect
      INTROSPECT_CLIENT_ID: intent-demo
      INTROSPECT_CLIENT_SECRET: ${TOKEN_SERVICE_CLIENT_SECRET}
      EXPECTED_TOKEN_AUDIENCE: intent_agent
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10.0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-3.0}
      VALIDATION_MAX_RETRIES: ${VALIDATION_MAX_RETRIES:-1}
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379
      AUDIT_DELIVERY: webhook
      AUDIT_HTTP_URL: http://console:3200/audit/webhook
      AUDIT_HTTP_METHOD: POST
      AUDIT_HTTP_AUTH_TYPE: api-key
      AUDIT_HTTP_API_KEY: ${AUDIT_WEBHOOK_API_KEY}
      AUDIT_HTTP_API_KEY_HEADER: X-API-Key
      AUDIT_ASYNC: "true"
    depends_on:
      redis:
        condition: service_healthy
      token-service:
        condition: service_healthy

  # Second instance + balancer (profile "cluster"): both instances share one
  # schema/policy cache entry in Redis; the console then talks to the balancer.
  intent-agent-2:
    image: ${INTENT_AGENT_IMAGE:-intent-agent:local}
    profiles: ["cluster"]
    expose:
      - "6003"
    environment:
      LOG_LEVEL: ${INTENT_LOG_LEVEL:-INFO}
      INTENT_PORT: 6003
      HEALTH_PORT: 8001
      ADVERTISED_HOST: intent-agent
      INTENT_AGENT_NAME: intent_agent_2
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      IK_APP_AGENT_KEY: ${APP_AGENT_CREDENTIALS_TOKEN}
      INTROSPECT_URL: http://token-service:8102/oauth2/introspect
      INTROSPECT_CLIENT_ID: intent-demo
      INTROSPECT_CLIENT_SECRET: ${TOKEN_SERVICE_CLIENT_SECRET}
      EXPECTED_TOKEN_AUDIENCE: intent_agent
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10.0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-3.0}
      VALIDATION_MAX_RETRIES: ${VALIDATION_MAX_RETRIES:-1}
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379
      AUDIT_DELIVERY: webhook
      AUDIT_HTTP_URL: http://console:3200/audit/webhook
      AUDIT_HTTP_METHOD: POST
      AUDIT_HTTP_AUTH_TYPE: api-key
      AUDIT_HTTP_API_KEY: ${AUDIT_WEBHOOK_API_KEY}
      AUDIT_HTTP_API_KEY_HEADER: X-API-Key
      AUDIT_ASYNC: "true"
    depends_on:
      redis:
        condition: service_healthy
      token-service:
        condition: service_healthy

  intent-balancer:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    profiles: ["cluster"]
    expose:
      - "6003"
    volumes:
      - ./nginx/intent-balancer.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - intent-agent
      - intent-agent-2

  redis:
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
