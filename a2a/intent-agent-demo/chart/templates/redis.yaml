{{- $c := merge (dict "component" "redis") . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo.name" $c }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "demo.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "demo.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "demo.selector" $c | nindent 8 }}
    spec:
      # Any uid works for redis; /data is an emptyDir owned via fsGroup.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ include "demo.image" .Values.redis.image }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy | default "IfNotPresent" }}
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          securityContext: {{- include "demo.securityContext" . | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo.name" $c }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "demo.labels" $c | nindent 4 }}
spec:
  selector: {{- include "demo.selector" $c | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
