# Inherits the repository-wide rules (select = ALL, line length 120, double
# quotes); only the test suites relax what pytest-style code cannot satisfy.
extend = "../../pyproject.toml"

# Keep ruff's import sorting in agreement with the repo's isort hook, which files
# the bridge's `server` and the console's `app` modules with the third-party
# imports (the arrangement the root config uses for instant-stack's `api`).
[lint.isort]
known-third-party = ["app", "server"]

[lint.per-file-ignores]
"auth0_bridge/tests/*" = [
    "S101",    # pytest asserts
    "S105",    # test fixtures carry literal "secrets" and token types
    "S106",
    "PLR2004", # expected status codes and values are literals by design
    "ANN",     # fixtures and test functions stay unannotated
    "ARG",     # autouse fixtures are requested for their side effect, not their value
    "D",       # test names are the documentation
    "SLF001",  # tests reset the module's private caches
]
"chatbot/tests/*" = [
    "S101",
    "S105",
    "S106",
    "PLR2004",
    "ANN",
    "ARG",
    "D",
    "SLF001",  # the discovery preview is tested through the module's private functions
]
