              {
                "type": "description",
                "value": "Compliant with SEC Rule 498, allowing for the delivery of a 'Summary Prospectus' for open-end mutual funds. Requires that key investor information be provided upfront, while detailed documents are available online. Ensures compliance with 'access equals delivery' provisions, provided that the required documents are hosted on a publicly accessible website, properly hyperlinked, and that requests for paper copies are met within three business days."
              }
            ]
          },
