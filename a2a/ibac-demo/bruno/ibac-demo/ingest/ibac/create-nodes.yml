                "value": "UCITS V"
              },
              {
                "type": "description",
                "value": "Under this agreement, the Depositary assumes strict liability for the loss of financial instruments held in custody, maintains legally protected segregation of assets (including at the sub-custodian level), and ensures that all delegation of safekeeping functions meets the stringent due diligence and independence standards of UCITS V."
