                "value": "This Agreement is subject to the Swiss Financial Services Act (FIDLEG/FinSA), which entered into force on January 1, 2020. [Company Name] acts as a financial service provider in accordance with FIDLEG. Based on the client information provided, the Client is classified as [Retail/Professional/Institutional]. In accordance with the Rules of Conduct (Art. 7-20 FIDLEG), [Company Name] is committed to acting in the client's best interest, providing transparency regarding products (including Key Information Documents - KIDs), disclosing fees/retrocessions, and ensuring best execution of orders. A [Suitability/Appropriateness] test will be performed. The client is aware of the risks associated with financial instruments as detailed in the 'Risks Involved in Trading Financial Instruments' brochure. This agreement ensures compliance with documentation and accountability requirements."
