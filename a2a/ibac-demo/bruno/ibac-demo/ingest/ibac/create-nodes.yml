              {
                "type": "name",
                "value": "PRIIPS Regulation"
              },
              {
                "type": "description",
                "value": "The firm complies with Regulation (EU) No 1286/2014 (and the UK equivalent, where applicable) regarding Packaged Retail and Insurance-based Investment Products (PRIIPs). We ensure that a Key Information Document (KID) is produced for all in-scope products, is accurate, fair, clear, and not misleading, and that it is provided to retail investors in good time prior to their investment. The KID is reviewed annually and updated promptly upon any significant change to risk, cost, or performance."
