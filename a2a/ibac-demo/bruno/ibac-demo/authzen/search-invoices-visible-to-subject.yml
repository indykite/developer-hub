---
info:
  name: Search Invoices the subject CAN_VIEW
  type: http
  seq: 3

http:
  method: POST
  url: "{{ik_api_url_prefix}}/access/v1/search/resource"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "subject": {
          "type": "Person",
          "id": "{{subject_external_id}}"
        },
        "action": {
          "name": "CAN_VIEW"
        },
        "resource": {
          "type": "Invoice"
        }
      }
  auth:
    type: apikey
    key: X-IK-ClientKey
    value: "{{agent_token}}"
    placement: header

runtime:
  scripts:
    - type: after-response
      code: |
        // Millicent (support + trading): 9; Vivienne 6; Cookie 3; Cashmere 1; Marmaduke 2 (own + his minor son's).
        test("Status code is 200", function () { expect(res.status).to.equal(200); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
