---
info:
  name: kbac
  type: folder
  seq: 3

request:
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{service_token}}"

docs: |-
  The 33 KBAC policies of the ibac dataset (instant-stack data/ibac
  manifest.json, kbac section), all with subject type Person: gateway
  (CAN_TRIGGER), quote, invoices for staff / customer / guardian, the
  chain-guarded CAN_DISCLOSE (filter value = the orchestrator's subject), the
  Intent Agent vocabulary for staff and customers, and the family policies.
  Service account bearer.
