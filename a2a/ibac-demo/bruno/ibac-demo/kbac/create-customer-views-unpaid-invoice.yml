---
info:
  name: Create Customer Views Unpaid Invoice
  type: http
  seq: 26

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "customer-views-unpaid-invoice",
        "display_name": "Views unpaid invoice",
        "description": "The person's open invoices: the invoice's state is a HAS_STATUS relationship to an InvoiceStatus node.",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"2.0-kbac\"},\"subject\":{\"type\":\"Person\"},\"actions\":[\"VIEW_UNPAID_INVOICE\"],\"resource\":{\"type\":\"Invoice\"},\"condition\":{\"cypher\":\"MATCH (subject:Person)-[:IS_CUSTOMER]->(:Customer)-[:HAS_INVOICE]->(resource:Invoice)-[:HAS_STATUS]->(status:InvoiceStatus) WHERE status.external_id = 'open'\"}}",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("kbac_customer_views_unpaid_invoice", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
