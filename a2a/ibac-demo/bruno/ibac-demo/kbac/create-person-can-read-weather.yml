---
info:
  name: Create Person Can Read The Weather
  type: http
  seq: 40

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "person-can-read-weather",
        "display_name": "Person can read the weather",
        "description": "Any person may read a Weather node (the HQ weather the external data resolvers populate). Gives the weather prompts a vocabulary the Intent Agent can map (action CAN_READ on Weather); the data itself comes from the get-hq-weather knowledge query.",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"2.0-kbac\"},\"subject\":{\"type\":\"Person\"},\"actions\":[\"CAN_READ\"],\"resource\":{\"type\":\"Weather\"},\"condition\":{\"cypher\":\"MATCH (subject:Person) MATCH (resource:Weather)\"}}",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("kbac_person_can_read_weather", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
