---
info:
  name: Create Staff Affected Account
  type: http
  seq: 19

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "staff-affected-account",
        "display_name": "Affected account",
        "description": "Accounts touched by a decision the person made (decision closed a ticket regarding the account).",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"2.0-kbac\"},\"subject\":{\"type\":\"Person\"},\"actions\":[\"AFFECTED\"],\"resource\":{\"type\":\"Account\"},\"condition\":{\"cypher\":\"MATCH (subject:Person)-[:MADE]->(:Decision)<-[:CLOSED_BY]-(:Ticket)-[:REGARDING]->(resource:Account)\"}}",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("kbac_staff_affected_account", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
