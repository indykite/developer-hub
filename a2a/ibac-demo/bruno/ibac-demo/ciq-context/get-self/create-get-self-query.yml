---
info:
  name: Create Get Self Query
  type: http
  seq: 2

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/knowledge-queries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-self",
        "display_name": "Get Self",
        "description": "Retrieve the authenticated person's profile: department and manager for staff, customer record for customers. Call tool 'ciq_execute' with no input_params. Example: { \"id\": \"get-self\", \"input_params\": { } }.",
        "project_id": "{{project_id}}",
        "policy_id": "{{get_self_policy}}",
        "query": "{\"nodes\":[\"subject.external_id\",\"subject.property.name\",\"subject.property.email\",\"subject.property.title\",\"subject.property.profession\",\"department.property.name\",\"manager.property.name\",\"customer.external_id\",\"customer.property.name\"],\"relationships\":[],\"aggregate_values\":[\"agent\"]}",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("get_self_query", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
