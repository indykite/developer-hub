---
info:
  name: Update Get Self Policy
  type: http
  seq: 4

http:
  method: PUT
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies/{{get_self_policy}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-self",
        "display_name": "Get Self",
        "description": "Return the authenticated person, their department and manager (staff) and their customer record (customers).",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"1.0-ciq\"},\"subject\":{\"type\":\"Person\"},\"condition\":{\"cypher\":\"MATCH (subject:Person {external_id: $token.sub}) WITH subject OPTIONAL MATCH (subject)-[:WORKS_IN]->(department:Department) WITH subject, department OPTIONAL MATCH (subject)-[:REPORTS_TO]->(manager:Person) WITH subject, department, manager OPTIONAL MATCH (subject)-[:IS_CUSTOMER]->(customer:Customer) WITH subject, department, manager, customer, $token.act.sub AS agent\",\"filter\":[]},\"allowed_reads\":{\"nodes\":[\"subject.*\",\"department.*\",\"manager.*\",\"customer.*\"],\"relationships\":[],\"aggregate_values\":[\"agent\"]}}",
        "status": "ACTIVE",
        "tags": [
          "ibac",
          "self",
          "profile"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
