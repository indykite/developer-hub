---
info:
  name: Create Get Decisions Query
  type: http
  seq: 2

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/knowledge-queries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-decisions",
        "display_name": "Get Decisions",
        "description": "get-decisions retrieves past decisions that have been made based on a document, probably a policy of some kind. The results include: the actor, the decision, the document applied in the decision, a relationship document_applied.type that describes the relationship between the decision and the document, the support ticket, and account. The only information required is the currently authenticated person's bearer token. Use this function when we need to find past decisions such as: \"What decisions incorporated the refund policy document?\" Returns: An object containing the decision, the document, a relationship that explains how the document was applied, the actor, the support ticket and the affected account. Call tool 'ciq_execute' with the person's bearer token as the authorization header. Use the following arguments: \"id\": \"get-decisions\". Example: { \"id\": \"get-decisions\", \"input_params\": { \"document_external_id\": \"refund_policy\" } }.",
        "project_id": "{{project_id}}",
        "policy_id": "{{get_decisions_policy}}",
        "query": "{\"nodes\":[\"actor.property.name\",\"actor.property.title\",\"document.property.name\",\"document.property.description\",\"document.property.url\",\"decision.external_id\",\"decision.property.description\",\"decision.create_time\",\"account.property.account_type\",\"ticket.external_id\",\"ticket.property.description\"],\"relationships\":[\"document_applied.type\"],\"aggregate_values\":[]}",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("get_decisions_query", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
