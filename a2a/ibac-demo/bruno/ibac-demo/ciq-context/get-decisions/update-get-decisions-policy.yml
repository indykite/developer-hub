---
info:
  name: Update Get Decisions Policy
  type: http
  seq: 4

http:
  method: PUT
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies/{{get_decisions_policy}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-decisions",
        "display_name": "Get Decisions",
        "description": "Given a document, return the decisions that referenced it along with the ticket, the customer and the affected account.",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"1.0-ciq\"},\"subject\":{\"type\":\"Person\"},\"condition\":{\"cypher\":\"MATCH (subject:Person {external_id: $token.sub})-[:WORKS_IN|CAN_ACCESS|CONTAINS*..4]->(document:Document {external_id: $document_external_id})<-[document_applied]-(decision:Decision)<--(ticket:Ticket)-[:REGARDING]->(account:Account), (ticket)-[:CREATED_BY]-(customer:Customer), (decision)<-[:MADE]-(actor:Person)\",\"filter\":[]},\"allowed_reads\":{\"nodes\":[\"subject.*\",\"actor.*\",\"document.*\",\"decision\",\"decision.*\",\"ticket.*\",\"account.*\",\"customer.*\"],\"relationships\":[\"document_applied.*\"],\"aggregate_values\":[]}}",
        "status": "ACTIVE",
        "tags": [
          "ibac",
          "decisions",
          "tickets"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
