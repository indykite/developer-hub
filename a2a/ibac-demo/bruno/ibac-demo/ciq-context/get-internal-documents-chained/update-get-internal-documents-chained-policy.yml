---
info:
  name: Update Get Internal Documents Chained Policy
  type: http
  seq: 4

http:
  method: PUT
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies/{{get_internal_documents_chained_policy}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-internal-documents-chained",
        "display_name": "Get Internal Documents (chain-guarded)",
        "description": "Return internal documents filtered by taxonomy, but only when the request carries the full ITS delegation chain of the console->orchestrator->retriever->mcp route.",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"1.0-ciq\"},\"subject\":{\"type\":\"Person\"},\"condition\":{\"cypher\":\"MATCH (subject:Person {external_id: $token.sub})-[:WORKS_IN|CAN_ACCESS|CONTAINS*..4]->(document:Document)-[:IS_TYPE]->(taxonomy:Taxonomy {external_id: $taxonomy_external_id})\",\"filter\":[],\"token_filter\":{\"attribute\":\"$ik_token.act.act.act.sub\",\"operator\":\"=\",\"value\":\"{{auth0_sub_orchestrator}}\",\"advice\":{\"error\":\"invalid_delegation_chain\",\"error_description\":\"Expected a depth-3 delegation chain with the orchestrator agent as the innermost actor ($ik_token.act.act.act.sub)\"}}},\"allowed_reads\":{\"nodes\":[\"subject.*\",\"document.*\",\"taxonomy.*\"],\"relationships\":[],\"aggregate_values\":[]}}",
        "status": "ACTIVE",
        "tags": [
          "ibac",
          "documents",
          "delegation",
          "chain"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
