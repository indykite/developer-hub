---
info:
  name: Create Explain Staff Workflow Access Policy
  type: http
  seq: 1

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "explain-staff-workflow-access",
        "display_name": "Explain Staff Workflow Access",
        "description": "Read the User-Department-Workflow authorization path for the console explainer (CanBank).",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"1.0-ciq\"},\"subject\":{\"type\":\"_Application\"},\"condition\":{\"cypher\":\"MATCH (subject:_Application) MATCH (u:Person {external_id: $subject_id})-[w:WORKS_IN]->(d:Department)-[t:CAN_TRIGGER]->(wf:Workflow {external_id: $workflow_id})\",\"filter\":[]},\"allowed_reads\":{\"nodes\":[\"u.*\",\"d.*\",\"wf.*\"],\"relationships\":[],\"aggregate_values\":[]}}",
        "status": "ACTIVE",
        "tags": [
          "explain",
          "authorization"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("explain_staff_workflow_access_policy", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
