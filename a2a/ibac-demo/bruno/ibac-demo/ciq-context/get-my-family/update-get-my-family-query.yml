---
info:
  name: Update Get My Family Query
  type: http
  seq: 5

http:
  method: PUT
  url: "{{ik_api_url_prefix}}/configs/v1/knowledge-queries/{{get_my_family_query}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-my-family",
        "display_name": "Get My Family",
        "description": "Retrieve the authenticated person's household: spouse or partner, children with their age group, and the accounts of children who are minors (adult children's accounts are not returned). Call tool 'ciq_execute' with no input_params. Example: { \"id\": \"get-my-family\", \"input_params\": { } }.",
        "project_id": "{{project_id}}",
        "policy_id": "{{get_my_family_policy}}",
        "query": "{\"nodes\":[\"subject.external_id\",\"subject.property.name\",\"spouse.external_id\",\"spouse.property.name\",\"child.external_id\",\"child.property.name\",\"child.property.age\",\"ageGroup.external_id\",\"account.external_id\",\"account.property.account_type\",\"account.property.balance\"],\"relationships\":[\"r_spouse\",\"r_parent\",\"r_owns\"],\"aggregate_values\":[]}",
        "status": "ACTIVE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
