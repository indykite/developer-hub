---
info:
  name: Update Get Hq Weather Policy
  type: http
  seq: 4

http:
  method: PUT
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies/{{get_hq_weather_policy}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-hq-weather",
        "display_name": "Get HQ Weather",
        "description": "Return the current weather reading for CanBank's London headquarters. The hq_weather Weather node's temperature property is populated at query time by the `weather` external data resolver, which calls open-meteo.",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"1.0-ciq\"},\"subject\":{\"type\":\"Person\"},\"condition\":{\"cypher\":\"MATCH (subject:Person {external_id: $token.sub}) WITH subject MATCH (weather:Weather {external_id: 'hq_weather'})\",\"filter\":[]},\"allowed_reads\":{\"nodes\":[\"subject.*\",\"weather.*\"],\"relationships\":[],\"aggregate_values\":[]}}",
        "status": "ACTIVE",
        "tags": [
          "ibac",
          "weather"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
