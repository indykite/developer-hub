---
info:
  name: Create Store Decision Policy
  type: http
  seq: 1

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "store-decision",
        "display_name": "Store Decision",
        "description": "Create a new Decision node and wire it to the document it applies (APPLIES), the ticket it closes (CLOSED_BY) and the authenticated user who made it (MADE) in one atomic CIQ upsert.",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"1.0-ciq\"},\"subject\":{\"type\":\"Person\"},\"condition\":{\"cypher\":\"MATCH (subject:Person {external_id: $token.sub}) MATCH (document:Document {external_id: $document_external_id}) MATCH (ticket:Ticket {external_id: $ticket_external_id})\",\"filter\":[]},\"allowed_upserts\":{\"nodes\":{\"node_types\":[\"Decision\"]},\"relationships\":{\"relationship_types\":[{\"type\":\"APPLIES\",\"source_node_label\":\"Decision\",\"target_node_label\":\"Document\"},{\"type\":\"MADE\",\"source_node_label\":\"Person\",\"target_node_label\":\"Decision\"},{\"type\":\"CLOSED_BY\",\"source_node_label\":\"Ticket\",\"target_node_label\":\"Decision\"}]}}}",
        "status": "ACTIVE",
        "tags": [
          "ibac",
          "decisions",
          "write"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("store_decision_policy", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
