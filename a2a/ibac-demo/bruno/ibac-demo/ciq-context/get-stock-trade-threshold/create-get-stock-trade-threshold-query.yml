---
info:
  name: Create Get Stock Trade Threshold Query
  type: http
  seq: 2

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/knowledge-queries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-stock-trade-threshold",
        "display_name": "Get Stock Trade Threshold",
        "description": "Retrieve a customer's stock account tier and threshold. Caller must be in the trading department. Example: { \"id\": \"get-stock-trade-threshold\", \"input_params\": { \"customer_external_id\": \"cust-cashmere\" } }.",
        "project_id": "{{project_id}}",
        "policy_id": "{{get_stock_trade_threshold_policy}}",
        "query": "{\"nodes\":[\"subject.external_id\",\"subject.property.name\",\"subject.property.title\",\"customer.property.name\",\"tier.property.name\",\"tier.property.threshold_amount\"],\"relationships\":[],\"aggregate_values\":[]}",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("get_stock_trade_threshold_query", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
