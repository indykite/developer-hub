---
info:
  name: Create Get Internal Documents Policy
  type: http
  seq: 1

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-internal-documents",
        "display_name": "Get Internal Documents",
        "description": "Return internal documents reachable from the caller filtered by taxonomy.",
        "project_id": "{{project_id}}",
        "policy": "{\"meta\":{\"policy_version\":\"1.0-ciq\"},\"subject\":{\"type\":\"Person\"},\"condition\":{\"cypher\":\"MATCH (subject:Person {external_id: $token.sub})-[:WORKS_IN|CAN_ACCESS|CONTAINS*..4]->(document:Document)-[:IS_TYPE]->(taxonomy:Taxonomy {external_id: $taxonomy_external_id})\",\"filter\":[]},\"allowed_reads\":{\"nodes\":[\"subject.*\",\"document.*\",\"taxonomy.*\"],\"relationships\":[],\"aggregate_values\":[]}}",
        "status": "ACTIVE",
        "tags": [
          "ibac",
          "documents",
          "taxonomy"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("get_internal_documents_policy", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
