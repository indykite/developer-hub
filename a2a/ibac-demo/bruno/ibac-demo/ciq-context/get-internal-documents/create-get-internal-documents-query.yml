---
info:
  name: Create Get Internal Documents Query
  type: http
  seq: 2

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/knowledge-queries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "get-internal-documents",
        "display_name": "Get Internal Documents",
        "description": "Retrieve internal documents visible to the caller filtered by taxonomy. Example: { \"id\": \"get-internal-documents\", \"input_params\": { \"taxonomy_external_id\": \"policy\" } }.",
        "project_id": "{{project_id}}",
        "policy_id": "{{get_internal_documents_policy}}",
        "query": "{\"nodes\":[\"subject.external_id\",\"subject.property.name\",\"subject.property.title\",\"document.external_id\",\"document.property.name\",\"document.property.description\",\"document.property.url\",\"taxonomy.property.name\"],\"relationships\":[],\"aggregate_values\":[]}",
        "status": "ACTIVE"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test("Status code is 200", function () { expect(res.status).to.equal(200); });
        if (res.body && res.body.id) bru.setEnvVar("get_internal_documents_query", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
