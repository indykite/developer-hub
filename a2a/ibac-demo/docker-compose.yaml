---

# Build images with
#   docker build -t chatbot:ibac-demo ./chatbot
#   docker build -t orchestrator-agent:ibac-demo ./orchestrator_agent
#   docker build -t retriever-agent:ibac-demo ./retriever_agent
#   docker build -t weather-agent:ibac-demo ./weather_agent
#
# or use the make command. The ibac-demo tag keeps these images apart from
# the sibling demos' :latest and :token-exchange builds of the same service
# names. The project name fixes container, network and volume names
# (ibac-demo-<service>-1, ibac-demo_<volume>) whatever the folder is called,
# and the host ports (3300, 7001-7006, 9102, 9881-9889, 9000) are disjoint
# from the siblings' so the stacks can run side by side.

name: ibac-demo

services:
  # Web UI
  chatbot:
    image: chatbot:ibac-demo
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./chatbot/Dockerfile
    # Usecase branding (ORG_NAME/ORG_TAGLINE) so the console adapts per usecase.
    env_file:
      - ./usecases/${USECASE:-ibac}/usecase.env
    # The console listens on 3300 inside the network (the gateways' static
    # audit-config.yaml and the agents' webhooks post there); CHATBOT_PORT is
    # the host port only, and the port the login redirect URLs carry.
    ports:
      - "${CHATBOT_PORT}:3300"
    networks:
      - console-network
      - orchestrator-iag-network
      - retriever-iag-network
      - weather-iag-network
      - mcp-iag-network
      - analyst-iag-network
      - drive-mcp-iag-network
      # Membership in every agent network lets the agents' exchanged-token
      # webhooks reach http://chatbot:3300 (harmless when a profile is off).
      - crm-iag-network
      - erp-mcp-iag-network
    volumes:
      - flask_session_data:/tmp/flask_session
      # App layer of the console (sections, action cards, prompts) - usecase data.
      - ./usecases/${USECASE:-ibac}/app.json:/app/usecase-app.json:ro
    environment:
      CHATBOT_PORT: ${CHATBOT_PORT}
      ORCHESTRATOR_HOST: ${IAG_ORCHESTRATOR_HOST}
      ORCHESTRATOR_PORT: ${IAG_ORCHESTRATOR_PORT}
      # Login at the Auth0 tenant (authorization code + PKCE). The audience
      # makes the access token a JWT issued for the console API - the one the
      # gateways accept and the dataset's Token Introspect validates.
      ID_SERVER_BASE_URL: https://${AUTH0_DOMAIN}
      ID_SERVER_TOKEN_ENDPOINT: oauth/token
      ID_SERVER_AUTHORIZE_ENDPOINT: authorize
      ID_SERVER_AUDIENCE: ${AUTH0_CONSOLE_AUDIENCE:-ibac-console}
      ID_SERVER_LOGOUT_ENDPOINT: v2/logout
      ID_SERVER_CLIENT_ID: ${CHATBOT_IDP_CLIENT_ID}
      ID_SERVER_CLIENT_SECRET: ${CHATBOT_IDP_CLIENT_SECRET}
      ID_SERVER_TOKEN_AUTH: basic
      CHATBOT_REDIRECT_URL: http://${CHATBOT_HOST}:${CHATBOT_PORT}/auth/callback
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      # "Explain the decision" (why? cards): the chatbot runs the two explain
      # CIQ queries against the platform with the app-agent credentials.
      # Feature hidden when the query ids are unset. The map names the
      # workflow a gateway's why? card explains (the gateways themselves no
      # longer pin workflows; the admission policy decides from the chain).
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      APP_AGENT_CREDENTIALS_TOKEN: ${APP_AGENT_CREDENTIALS_TOKEN}
      # App layer staff check: a knowledge query run on the platform's MCP
      # server as the logged-in user (app.json staff_check).
      MCP_SERVER_URL: ${MCP_SERVER_URL}
      EXPLAIN_STAFF_QUERY_ID: ${EXPLAIN_STAFF_QUERY_ID:-}
      EXPLAIN_DIRECT_QUERY_ID: ${EXPLAIN_DIRECT_QUERY_ID:-}
      EXPLAIN_WORKFLOW_MAP: >-
        orchestrator-iag=${WORKFLOW_ID},retriever-iag=${WORKFLOW_ID},
        mcp-iag=${WORKFLOW_ID},weather-iag=${WEATHER_WORKFLOW_ID:-},
        analyst-iag=${ANALYST_WORKFLOW_ID:-},crm-iag=${CRM_WORKFLOW_ID:-},
        drive-mcp-iag=${DRIVE_WORKFLOW_ID:-},erp-mcp-iag=${ERP_WORKFLOW_ID:-}
      # Architecture page (/static/architecture.html): badge the active
      # usecase and dim the drive/crm/erp groups when their profile is off.
      USECASE: ${USECASE:-ibac}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # Deny -> remediate -> allow: gateways whose DENY cards offer a
      # one-click CAN_TRIGGER grant, and the workflow bundle one click writes
      # (empty = feature off). The grant is guarded by a live AuthZEN
      # self-check on the logged-in user.
      AUTHZEN_SUBJECT_TYPES: ${AUTHZEN_SUBJECT_TYPES:-Person}
      GRANT_WORKFLOW_MAP: ${GRANT_WORKFLOW_MAP:-}
      # The agents' subjects in the delegation chain and the audit records
      # are their Auth0 M2M clients (<client_id>@clients); the console shows
      # these names instead (same as the Agent nodes' name property) and
      # keeps the raw subject as a tooltip.
      # IBAC discovery preview on the INTENT cards: the entry agent's raw
      # public card (with the skills' x-coaz-mappings), read from the agent
      # itself - the gateway serves a typed copy without the extension.
      IBAC_CARD_URL: http://${ORCHESTRATOR_HOST}:${ORCHESTRATOR_PORT}/.well-known/agent-card.json
      AGENT_DISPLAY_NAMES: >-
        ${ORCHESTRATOR_IDP_CLIENT_ID}@clients=orchestrator-agent,
        ${RETRIEVER_IDP_CLIENT_ID}@clients=retriever-agent,
        ${WEATHER_IDP_CLIENT_ID}@clients=weather-agent,
        ${ANALYST_IDP_CLIENT_ID}@clients=analyst-agent,
        ${MCP_IDP_CLIENT_ID}@clients=mcp-gateway,
        ${DRIVE_MCP_IDP_CLIENT_ID:-}@clients=drive-mcp-gateway,
        ${CRM_IDP_CLIENT_ID:-}@clients=crm-agent,
        ${ERP_MCP_IDP_CLIENT_ID:-}@clients=erp-mcp-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python app.py --host 0.0.0.0 --port 3300

  # Auth0 bridge - the gateways' identity provider endpoint (see
  # auth0_bridge/README.md). Auth0 publishes no RFC 7662 introspection
  # endpoint, which is the only way a gateway validates the user's access
  # token (and the Intent Agent its bearer); the bridge answers it by
  # verifying Auth0's JWTs against the tenant JWKS, and forwards the
  # gateways' client-credentials grants to Auth0 with the agents' audience
  # added. Not published on the host; a member of every gateway network.
  auth0-bridge:
    image: auth0-bridge:ibac-demo
    #    build:
    #      context: ./auth0_bridge
    networks:
      - orchestrator-iag-network
      - retriever-iag-network
      - weather-iag-network
      - analyst-iag-network
      - mcp-iag-network
      - drive-mcp-iag-network
      - crm-iag-network
      - erp-mcp-iag-network
    environment:
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      # Audience of the gateways' actor tokens (the ibac-agents API); the
      # Token Service matches actor tokens on it.
      AUTH0_DEFAULT_AUDIENCE: ${AUTH0_AGENTS_AUDIENCE:-ibac-agents}
      BRIDGE_PORT: 8090
      LOG_LEVEL: ${LOG_LEVEL}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # IndyKite Token Service - the issuer of exchanged (delegation) tokens. Every
  # gateway calls its /oauth2/token instead of exchanging at the external IdP
  # (JARVIS_TOKEN_SERVICE_* in iag-base-docker.yaml); the delegated token then
  # travels in X-IK-Token beside the user's untouched Authorization header
  # (policies read it as $ik_token). See token-service/.
  token-service:
    # Official image. The default is the published release pinned by digest
    # (https://hub.docker.com/r/indykite/token-service/tags); .env may name
    # another image as TOKEN_SERVICE_IMAGE. Keep it in step with the gateways'
    # AGENT_GATEWAY_IMAGE: a gateway with IBAC on passes the intent on and
    # needs a Token Service that writes it into the token.
    image: ${TOKEN_SERVICE_IMAGE:-indykite/token-service:1.0.0@sha256:a1248b73ab22fb939e533455a89468b7112b2b938486d8feca818e17776a97e2}
    # The image is linux/amd64 only - request it explicitly so arm64 hosts
    # (Apple Silicon) pull it under emulation instead of failing with
    # "no matching manifest".
    platform: linux/amd64
    # The image bakes a HEALTHCHECK on :9080/healthz; probe the real OIDC
    # endpoint instead: it proves the service loaded its config and serves
    # traffic on 8102, not just that the healthcheck server is up.
    healthcheck:
      test: ["CMD", "/bin/http_health_probe", "http://localhost:8102/.well-known/openid-configuration"]
      interval: 10s
      timeout: 1s
      start_period: 10s
    ports:
      - "${TOKEN_SERVICE_PORT:-9102}:8102"
    # Member of every gateway network: each gateway exchanges and introspects
    # here (the profile-gated crm/erp networks exist even when their profile
    # is off).
    networks:
      - orchestrator-iag-network
      - retriever-iag-network
      - weather-iag-network
      - analyst-iag-network
      - mcp-iag-network
      - drive-mcp-iag-network
      - crm-iag-network
      - erp-mcp-iag-network
    volumes:
      # Holds the private signing key + client secret - gitignored; create it
      # from token-service/token-service.example.yaml.
      - ./token-service/token-service.yaml:/app/.configs/token-service.yaml:ro
    command: ["--config=/app/.configs/token-service.yaml"]

  # Protects Orchestrator
  orchestrator-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_ORCHESTRATOR_PORT}:${IAG_ORCHESTRATOR_PORT}"
    networks:
      - orchestrator-iag-network
    environment:
      K_SERVICE: orchestrator-iag
      JARVIS_SERVICE_NAME: orchestrator-iag
      JARVIS_SERVICE_PORT: ${IAG_ORCHESTRATOR_PORT}
      # Public URL of the gateway: the interface URL in the agent card it serves.
      JARVIS_SERVICE_BASE_URL: http://${IAG_ORCHESTRATOR_HOST}:${IAG_ORCHESTRATOR_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${ORCHESTRATOR_HOST}:${ORCHESTRATOR_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${ORCHESTRATOR_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${ORCHESTRATOR_IDP_CLIENT_SECRET}
      # Intent-Based Access Control (profile intent). With IBAC on, the
      # gateway asks the Intent Agent what each prompt means before
      # forwarding it (client-credentials token for the intent_agent
      # audience): an intent lets the message through, a failed intent is
      # answered to the caller in place of the agent (error + obligation,
      # `intent_error` in the message metadata), an unreachable agent is 502
      # and a timeout 504. Every call is an INTENT audit record. A message
      # with an intent is first compared with the skills of the orchestrator
      # the caller may use (the x-coaz-mappings on its agent card): an intent
      # that fits no skill is refused with 403, and only the evaluations that
      # fit go on. The gateway then exchanges the token a second time at the
      # Token Service, which writes those evaluations into act.intent of the
      # token the agent receives in X-IK-Token; an intent with more
      # evaluations than the Token Service accepts
      # (idp.max_intent_evaluations, 10 by default) is answered by the
      # gateway, asking the caller to split the request. Each comparison is
      # an IBAC_DISCOVERY record. Off = the agent is never asked. Only the
      # entry gateway asks, once per prompt.
      JARVIS_IBAC_ENABLED: ${IBAC_ENABLED:-false}
      # A skill without a mapping: allow = it fits every intent, deny = it
      # fits none. The orchestrator's web-search skill has no mapping and
      # every workflow permits it, so with allow no intent is refused or
      # trimmed here; with deny only the mapped skills count.
      JARVIS_IBAC_CAPABILITIES_UNMAPPED: ${IBAC_UNMAPPED:-allow}
      JARVIS_INTENT_AGENT_BASE_URL: ${INTENT_AGENT_BASE_URL:-http://intent-agent:6003}
      JARVIS_INTENT_AGENT_AUDIENCE: ${INTENT_AGENT_AUDIENCE:-intent_agent}
      # Above the Intent Agent's own per-request limit, so a slow prompt is
      # answered by the agent rather than cut off by the gateway.
      JARVIS_INTENT_AGENT_TIMEOUT: ${INTENT_AGENT_TIMEOUT:-45s}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  orchestrator:
    image: orchestrator-agent:ibac-demo
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./orchestrator_agent/Dockerfile
    # Usecase bundle: domain vocabulary (env) + skills (volume). Switch demos
    # with USECASE=<name> in .env; see usecases/README.md.
    env_file:
      - ./usecases/${USECASE:-ibac}/usecase.env
    volumes:
      - ./usecases/${USECASE:-ibac}/skills/orchestrator:/app/skills:ro
    ports:
      - "${ORCHESTRATOR_PORT}:${ORCHESTRATOR_PORT}"
    networks:
      - orchestrator-iag-network
      - retriever-iag-network
      - weather-iag-network
      - analyst-iag-network
      - crm-iag-network
    environment:
      ADVERTISED_HOST: ${ORCHESTRATOR_HOST}
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT}
      ORCHESTRATOR_AGENT_NAME: orchestrator_agent
      CHATBOT_UPDATES_URL: http://chatbot:3300/api/push-update
      RETRIEVER_HOST: ${IAG_RETRIEVER_HOST}
      RETRIEVER_PORT: ${IAG_RETRIEVER_PORT}
      WEATHER_HOST: ${IAG_WEATHER_HOST}
      WEATHER_PORT: ${IAG_WEATHER_PORT}
      # Routes query_drive (console -> orchestrator -> analyst -> drive-mcp-iag)
      # through the analyst gateway; leave empty to disable the Drive tool.
      ANALYST_HOST: ${IAG_ANALYST_HOST}
      ANALYST_PORT: ${IAG_ANALYST_PORT}
      # Routes query_crm (console -> orchestrator -> crm-iag -> crm agent ->
      # Salesforce) through the CRM gateway; leave empty to disable the tool.
      CRM_HOST: ${IAG_CRM_HOST:-}
      CRM_PORT: ${IAG_CRM_PORT:-9888}
      # Enables query_erp (invoices via the analyst's erp_* backend); set
      # true in the usecase env once the erp profile + backend are wired.
      ERP_TOOL_ENABLED: ${ERP_TOOL_ENABLED:-}
      GEMINI_ENABLED: ${GEMINI_ENABLED}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_MODEL: ${LOCAL_LLM_MODEL}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/mcp/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects Retriever
  retriever-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_RETRIEVER_PORT}:${IAG_RETRIEVER_PORT}"
    networks:
      - retriever-iag-network
    environment:
      K_SERVICE: retriever-iag
      JARVIS_SERVICE_NAME: retriever-iag
      JARVIS_SERVICE_PORT: ${IAG_RETRIEVER_PORT}
      JARVIS_SERVICE_BASE_URL: http://${IAG_RETRIEVER_HOST}:${IAG_RETRIEVER_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${RETRIEVER_HOST}:${RETRIEVER_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${RETRIEVER_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${RETRIEVER_IDP_CLIENT_SECRET}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  retriever:
    image: retriever-agent:ibac-demo
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./retriever_agent/Dockerfile
    env_file:
      - ./usecases/${USECASE:-ibac}/usecase.env
    volumes:
      - ./usecases/${USECASE:-ibac}/skills/retriever:/app/skills:ro
    ports:
      - "${RETRIEVER_PORT}:${RETRIEVER_PORT}"
    networks:
      - retriever-iag-network
      - mcp-iag-network
    environment:
      ADVERTISED_HOST: ${RETRIEVER_HOST}
      RETRIEVER_PORT: ${RETRIEVER_PORT}
      RETRIEVER_AGENT_NAME: retriever_agent
      CHATBOT_UPDATES_URL: http://chatbot:3300/api/push-update
      # Route MCP calls through the MCP-protecting IAG instead of the MCP server
      # directly. To bypass the IAG, set this back to ${MCP_SERVER_URL}.
      MCP_SERVER_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      # Reuse window (seconds) for the per-user MCP session; 0 = new session
      # per request. Keep below the access-token lifetime.
      MCP_SESSION_TTL: ${MCP_SESSION_TTL:-300}
      GEMINI_ENABLED: ${GEMINI_ENABLED}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_MODEL: ${LOCAL_LLM_MODEL}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/mcp/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects Weather
  weather-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_WEATHER_PORT}:${IAG_WEATHER_PORT}"
    networks:
      - weather-iag-network
    environment:
      K_SERVICE: weather-iag
      JARVIS_SERVICE_NAME: weather-iag
      JARVIS_SERVICE_PORT: ${IAG_WEATHER_PORT}
      JARVIS_SERVICE_BASE_URL: http://${IAG_WEATHER_HOST}:${IAG_WEATHER_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${WEATHER_HOST}:${WEATHER_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${WEATHER_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${WEATHER_IDP_CLIENT_SECRET}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  #  Protects Analyst
  analyst-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_ANALYST_PORT}:${IAG_ANALYST_PORT}"
    networks:
      - analyst-iag-network
    environment:
      K_SERVICE: analyst-iag
      JARVIS_SERVICE_NAME: analyst-iag
      JARVIS_SERVICE_PORT: ${IAG_ANALYST_PORT}
      JARVIS_SERVICE_BASE_URL: http://${IAG_ANALYST_HOST}:${IAG_ANALYST_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${ANALYST_HOST}:${ANALYST_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${ANALYST_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${ANALYST_IDP_CLIENT_SECRET}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  analyst:
    image: analyst-agent:ibac-demo
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./analyst_agent/Dockerfile
    env_file:
      - ./usecases/${USECASE:-ibac}/usecase.env
    volumes:
      - ./usecases/${USECASE:-ibac}/skills/analyst:/app/skills:ro
    ports:
      - "${ANALYST_PORT}:${ANALYST_PORT}"
    networks:
      - analyst-iag-network
      - mcp-iag-network
      # Membership in the drive/erp gateway networks is harmless while their
      # profiles are off; it only matters when ANALYST_MCP_SERVER_URLS adds
      # those backends.
      - drive-mcp-iag-network
      - erp-mcp-iag-network
    environment:
      ADVERTISED_HOST: ${ANALYST_HOST}
      ANALYST_PORT: ${ANALYST_PORT}
      ANALYST_AGENT_NAME: analyst_agent
      CHATBOT_UPDATES_URL: http://chatbot:3300/api/push-update
      # Route MCP calls through the MCP-protecting IAG instead of the MCP server
      # directly. To bypass the IAG, set this back to ${MCP_SERVER_URL}.
      MCP_SERVER_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      # Multi-backend mode: comma-separated alias=url pairs (see .example.env).
      # When set, this overrides MCP_SERVER_URL and tool names get the alias as
      # prefix (indykite_ciq_execute, drive_search, ...).
      MCP_SERVER_URLS: ${ANALYST_MCP_SERVER_URLS:-}
      # Reuse window (seconds) for per-user MCP sessions; 0 = new session per
      # request. Keep below the access-token lifetime.
      MCP_SESSION_TTL: ${MCP_SESSION_TTL:-300}
      GEMINI_ENABLED: ${GEMINI_ENABLED}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_MODEL: ${LOCAL_LLM_MODEL}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/mcp/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects the CRM agent (Salesforce cases, staff-only wf-crm; leave
  #  IAG_CRM_HOST empty to hide the orchestrator's query_crm tool)
  crm-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    # Started only when COMPOSE_PROFILES in .env enables the "crm" profile.
    profiles: ["crm"]
    ports:
      - "${IAG_CRM_PORT:-9888}:${IAG_CRM_PORT:-9888}"
    networks:
      - crm-iag-network
    environment:
      K_SERVICE: crm-iag
      JARVIS_SERVICE_NAME: crm-iag
      JARVIS_SERVICE_PORT: ${IAG_CRM_PORT:-9888}
      JARVIS_SERVICE_BASE_URL: http://${IAG_CRM_HOST:-crm-iag}:${IAG_CRM_PORT:-9888}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${CRM_HOST:-crm}:${CRM_PORT:-7006}
      # Defaults keep `docker compose up` warning-free with a .env predating
      # the CRM pair - compose validates these specs even when the profile is
      # disabled (same convention as the drive PoC).
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${CRM_IDP_CLIENT_ID:-}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${CRM_IDP_CLIENT_SECRET:-}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  crm:
    image: crm-agent:ibac-demo
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./crm_agent/Dockerfile
    profiles: ["crm"]
    env_file:
      - ./usecases/${USECASE:-ibac}/usecase.env
    # Deliberately NOT published to the host: the agent trusts the delegation
    # token it receives because crm-iag minted and verified it. A host port
    # would allow bypassing the gateway with a self-crafted JWT, whose spoofed
    # sub/act would be written into Salesforce as attribution. Only crm-iag
    # reaches it, over the internal network.
    networks:
      - crm-iag-network
    environment:
      ADVERTISED_HOST: ${CRM_HOST:-crm}
      CRM_PORT: ${CRM_PORT:-7006}
      CRM_AGENT_NAME: crm_agent
      CHATBOT_UPDATES_URL: http://chatbot:3300/api/push-update
      # Salesforce connected app (OAuth 2.0 JWT Bearer flow, RFC 7523). The
      # private key pairs with the certificate uploaded to the connected app;
      # mounted read-only from ./crm_agent/keys (gitignored).
      SF_LOGIN_URL: ${SF_LOGIN_URL:-https://login.salesforce.com}
      SF_CONSUMER_KEY: ${SF_CONSUMER_KEY:-}
      SF_USERNAME: ${SF_USERNAME:-}
      SF_PRIVATE_KEY_FILE: ${SF_PRIVATE_KEY_FILE:-/app/keys/sf-jwt.key}
      SF_API_VERSION: ${SF_API_VERSION:-v61.0}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
    volumes:
      - ./crm_agent/keys:/app/keys:ro
      # No SKILL.md (the agent has no LLM); the bundle folder carries the
      # x-coaz-mappings the agent publishes on its card.
      - ./usecases/${USECASE:-ibac}/skills/crm:/app/skills:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects the MCP server (MCP-protocol proxy mode)
  #  Single shared gateway that the retriever and weather agents call instead of
  #  hitting the MCP server directly, so MCP traffic is subject to the same
  #  token introspection, AuthZEN authorization and audit logging as the A2A flows.
  mcp-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_MCP_PORT}:${IAG_MCP_PORT}"
    networks:
      - mcp-iag-network
    environment:
      K_SERVICE: mcp-iag
      JARVIS_SERVICE_NAME: mcp-iag
      JARVIS_SERVICE_PORT: ${IAG_MCP_PORT}
      # Switch the gateway out of the default "a2a" proxy mode into MCP proxy mode.
      JARVIS_PROTECTED_AGENT_PROTOCOL: mcp
      # The gateway serves ONE MCP endpoint: the public URL (with its path,
      # unencoded gid) is what the agents call and what its OAuth protected
      # resource metadata names; the protected URL is the full endpoint of the
      # IndyKite MCP server it forwards to. Any other path answers 404.
      JARVIS_SERVICE_BASE_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      JARVIS_PROTECTED_AGENT_BASE_URL: ${MCP_SERVER_ORIGIN}${MCP_SERVER_PATH}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${MCP_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${MCP_IDP_CLIENT_SECRET}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  weather:
    image: weather-agent:ibac-demo
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./weather_agent/Dockerfile
    env_file:
      - ./usecases/${USECASE:-ibac}/usecase.env
    ports:
      - "${WEATHER_PORT}:${WEATHER_PORT}"
    networks:
      - weather-iag-network
      - mcp-iag-network
    environment:
      ADVERTISED_HOST: ${WEATHER_HOST}
      WEATHER_PORT: ${WEATHER_PORT}
      WEATHER_AGENT_NAME: weather_agent
      CHATBOT_UPDATES_URL: http://chatbot:3300/api/push-update
      # Route MCP calls through the MCP-protecting IAG instead of the MCP server
      # directly. To bypass the IAG, set this back to ${MCP_SERVER_URL}.
      MCP_SERVER_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      # Reuse window (seconds) for the per-user MCP session; 0 = new session
      # per request. Keep below the access-token lifetime.
      MCP_SESSION_TTL: ${MCP_SESSION_TTL:-300}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      CIQ_QUERY_HQ_WEATHER: ${CIQ_QUERY_HQ_WEATHER:-get-hq-weather}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/mcp/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Google Drive MCP proof-of-concept (compose profile "drive"):
  #  the reference stdio Drive MCP server wrapped by supergateway into
  #  Streamable HTTP, protected by its own IAG in MCP proxy mode.
  #  The Drive server holds its OWN Google credentials (mounted below); the
  #  gateway strips the caller's Authorization and injects its IdP delegation
  #  token, which this downstream ignores. Start with:
  #    docker compose --profile drive up
  drive-mcp-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    profiles: ["drive"]
    # Defaults on every ${DRIVE_*} var keep `docker compose up` working with a
    # .env predating this PoC - compose validates these specs even when the
    # profile is disabled.
    ports:
      - "${IAG_DRIVE_MCP_PORT:-9887}:${IAG_DRIVE_MCP_PORT:-9887}"
    networks:
      - drive-mcp-iag-network
    environment:
      K_SERVICE: drive-mcp-iag
      JARVIS_SERVICE_NAME: drive-mcp-iag
      JARVIS_SERVICE_PORT: ${IAG_DRIVE_MCP_PORT:-9887}
      # MCP proxy mode, same as mcp-iag: one endpoint, /mcp on both sides.
      JARVIS_PROTECTED_AGENT_PROTOCOL: mcp
      JARVIS_SERVICE_BASE_URL: http://${IAG_DRIVE_MCP_HOST:-drive-mcp-iag}:${IAG_DRIVE_MCP_PORT:-9887}/mcp
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${DRIVE_MCP_HOST:-drive-mcp}:8000/mcp
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${DRIVE_MCP_IDP_CLIENT_ID:-}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${DRIVE_MCP_IDP_CLIENT_SECRET:-}
      # This gateway only: the Drive server serves every file as an MCP
      # resource (gdrive:///<fileId>), ids that cannot be modelled in advance,
      # so with the checks on a resources/read would be refused. Admission
      # still decides who reaches the server. true = only the modelled
      # `search` tool passes and file reads are refused.
      JARVIS_AUTHZEN_CAPABILITIES_ENABLED: ${IAG_DRIVE_CAPABILITY_CHECKS:-false}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  drive-mcp:
    image: drive-mcp:ibac-demo
    #    build:
    #      context: .
    #      dockerfile: ./drive_mcp/Dockerfile
    profiles: ["drive"]
    ports:
      - "${DRIVE_MCP_PORT:-9000}:8000"
    networks:
      - drive-mcp-iag-network
    environment:
      # Paths to the mounted Google OAuth material (values are paths, not secrets).
      GDRIVE_OAUTH_PATH: /gdrive/gcp-oauth.keys.json
      GDRIVE_CREDENTIALS_PATH: /gdrive/.gdrive-server-credentials.json
    volumes:
      # Google OAuth material - see drive_mcp/README.md for the auth bootstrap.
      - ./drive_mcp/.gdrive:/gdrive:ro

  #  Protects the ERP MCP server (MCP-protocol proxy mode). Optional "erp"
  #  profile: a Postgres invoices table whose rows are pre-filtered per caller
  #  by AuthZEN search/resource before any SQL runs - same prompt, different
  #  rows, and the database knows nothing about the graph.
  erp-mcp-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    profiles: ["erp"]
    ports:
      - "${IAG_ERP_MCP_PORT:-9889}:${IAG_ERP_MCP_PORT:-9889}"
    networks:
      # Client-facing net (analyst/chatbot) + the private backend net where
      # erp-mcp and erp-db live - this gateway is the only bridge between them.
      - erp-mcp-iag-network
      - erp-backend-network
    environment:
      K_SERVICE: erp-mcp-iag
      JARVIS_SERVICE_NAME: erp-mcp-iag
      JARVIS_SERVICE_PORT: ${IAG_ERP_MCP_PORT:-9889}
      JARVIS_PROTECTED_AGENT_PROTOCOL: mcp
      JARVIS_SERVICE_BASE_URL: http://erp-mcp-iag:${IAG_ERP_MCP_PORT:-9889}/mcp
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${ERP_MCP_HOST:-erp-mcp}:${ERP_MCP_PORT:-8010}/mcp
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${ERP_MCP_IDP_CLIENT_ID:-}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${ERP_MCP_IDP_CLIENT_SECRET:-}
      # Intent-Based Access Control on the ERP tools. With IBAC on, a call of
      # a tool that publishes mappings (erp-mcp does, for both tools) is
      # compared with the intent the entry gateway wrote into the delegated
      # token: a call the intent does not match is refused with 403, and for
      # get_invoice the gateway asks the platform whether the caller may view
      # that invoice before the server sees the call. Every check is an
      # IBAC_USAGE record, the platform question a RESOLVED_EVALUATIONS one.
      # The tools list is filtered the same way: under an intent about
      # something else the caller sees no ERP tool (IBAC_DISCOVERY records).
      # A token without an intent, or a tool without a mapping, passes as
      # with IBAC off. No Intent Agent is asked here.
      JARVIS_IBAC_ENABLED: ${IBAC_ENABLED:-false}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  erp-mcp:
    image: erp-mcp:ibac-demo
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./erp_mcp/Dockerfile
    profiles: ["erp"]
    # Trust boundary, enforced by topology: the server trusts the delegation
    # token's subject because erp-mcp-iag minted and verified it - so nothing
    # else may reach it (a direct caller could forge a JWT and read other
    # subjects' rows). No host port, and membership ONLY in the private
    # backend net, which clients (analyst/chatbot) are not on; the gateway
    # is the sole bridge.
    networks:
      - erp-backend-network
    environment:
      ERP_MCP_PORT: ${ERP_MCP_PORT:-8010}
      ERP_DB_DSN: postgresql://erp:erp@erp-db:5432/erp
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      APP_AGENT_CREDENTIALS_TOKEN: ${APP_AGENT_CREDENTIALS_TOKEN}
      # Subject node type for the AuthZEN search; reuses the gateways'
      # subject-type env (every login of the ibac dataset is a Person).
      ERP_SUBJECT_TYPE: ${AUTHZEN_SUBJECT_TYPES:-Person}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - erp-db

  erp-db:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    profiles: ["erp"]
    # Private backend net only - reached exclusively by erp-mcp.
    networks:
      - erp-backend-network
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    volumes:
      - ./erp_mcp/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # postgres 18+ keeps its data in a version-specific subdirectory, so the
      # volume mounts one level up from the data directory.
      - erp_db_data:/var/lib/postgresql

  #  Intent Agent (compose profile "intent"): the orchestrator gateway sends it
  #  the prompt of every A2A message together with the subject whoami resolved,
  #  and gets back the intent - AuthZEN-shaped evaluations (subject, action,
  #  resource, context) constrained to this project's data schema and the
  #  caller's active KBAC policies. With an intent the gateway forwards the
  #  message; without one it answers the caller itself (see orchestrator-iag).
  #  The agent authenticates the gateway's bearer (an Auth0 M2M token for the
  #  intent_agent audience) by RFC 7662 at the auth0-bridge, reads schema and
  #  policies with the app agent credential, extracts with Gemini, caches in
  #  redis, and audits to the console webhook. Enable with IBAC_ENABLED=true
  #  + the profile in .env. The image is the published indykite/intent-agent
  #  (pinned by digest); INTENT_AGENT_IMAGE overrides it for a local build.
  intent-agent:
    image: ${INTENT_AGENT_IMAGE:-docker.io/indykite/intent-agent:1.1.0@sha256:a9e8271ada04e13f52218046df0c88641274fdf7658bacd50e4c4bda6ee3d71c}
    profiles: ["intent"]
    expose:
      - "6003"
      - "8001"
    networks:
      # orchestrator-iag calls it; the bridge and the console live there too.
      - orchestrator-iag-network
      - intent-backend-network
    environment:
      LOG_LEVEL: ${INTENT_LOG_LEVEL:-INFO}
      INTENT_PORT: 6003
      HEALTH_PORT: 8001
      ADVERTISED_HOST: intent-agent
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${INTENT_GEMINI_MODEL:-gemini-3.5-flash-lite}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      # X-IK-ClientKey for /data-schema/v1 and /access/v1/policies (needs
      # ReadDataSchema + ReadAuthZConfigs, which the ibac app agent has).
      IK_APP_AGENT_KEY: ${APP_AGENT_CREDENTIALS_TOKEN}
      # RFC 7662 at the bridge, authenticated as one of the tenant's M2M
      # applications (the orchestrator's by default).
      INTROSPECT_URL: http://auth0-bridge:8090/oauth/introspect
      INTROSPECT_CLIENT_ID: ${INTENT_INTROSPECT_CLIENT_ID:-${ORCHESTRATOR_IDP_CLIENT_ID}}
      INTROSPECT_CLIENT_SECRET: ${INTENT_INTROSPECT_CLIENT_SECRET:-${ORCHESTRATOR_IDP_CLIENT_SECRET}}
      EXPECTED_TOKEN_AUDIENCE: ${INTENT_AGENT_AUDIENCE:-intent_agent}
      REQUEST_TIMEOUT_SECONDS: ${INTENT_REQUEST_TIMEOUT_SECONDS:-10.0}
      LLM_TIMEOUT_SECONDS: ${INTENT_LLM_TIMEOUT_SECONDS:-3.0}
      VALIDATION_MAX_RETRIES: ${INTENT_VALIDATION_MAX_RETRIES:-1}
      # How long the agent keeps the project's policy list and data schema
      # (minutes, fractions allowed) before reading them again: how soon a
      # policy or node type added to the dataset reaches the intents.
      POLICY_REFRESH_TTL_MINUTES: ${INTENT_REFRESH_TTL_MINUTES:-0.5}
      SCHEMA_REFRESH_TTL_MINUTES: ${INTENT_REFRESH_TTL_MINUTES:-0.5}
      CACHE_BACKEND: redis
      REDIS_URL: redis://intent-redis:6379
      # Audit records go to the console's audit terminal like the gateways'.
      AUDIT_DELIVERY: webhook
      AUDIT_HTTP_URL: http://chatbot:3300/api/push-update
      AUDIT_HTTP_METHOD: POST
      AUDIT_HTTP_AUTH_TYPE: no-auth
      AUDIT_ASYNC: "true"
    depends_on:
      intent-redis:
        condition: service_healthy
      auth0-bridge:
        condition: service_healthy

  intent-redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    profiles: ["intent"]
    expose:
      - "6379"
    # Private net: only the Intent Agent reaches it.
    networks:
      - intent-backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  console-network:
    driver: bridge
  orchestrator-iag-network:
    driver: bridge
  retriever-iag-network:
    driver: bridge
  weather-iag-network:
    driver: bridge
  analyst-iag-network:
    driver: bridge
  crm-iag-network:
    driver: bridge
  mcp-iag-network:
    driver: bridge
  drive-mcp-iag-network:
    driver: bridge
  erp-mcp-iag-network:
    driver: bridge
  # Private net for erp-mcp + erp-db; only the erp gateway bridges into it.
  # A normal bridge (not internal:true) so erp-mcp keeps egress to the
  # platform's search/resource API.
  erp-backend-network:
    driver: bridge
  # Private net for the Intent Agent and its redis cache.
  intent-backend-network:
    driver: bridge

volumes:
  flask_session_data: {}
  erp_db_data: {}
