---
# Token-service configuration for the ibac-demo.
# EXAMPLE - copy to token-service.yaml and fill in real keys/secrets.
# Reference for every field: https://developer.indykite.com/guides/guide-token-service

service:
  name: token-service
  port: 8102
  environment: local
  log_level: debug
  # Issuer: the `iss` of every token this service signs. An identifier, not
  # necessarily reachable - relying parties are configured with it.
  # NOTE: must be https:// - the IndyKite platform routes third-party JWT
  # introspection only for https issuers (http issuers are treated as opaque
  # tokens). This is an identifier, not a transport address: the gateways
  # still call the service at http://token-service:8102 inside the compose
  # network, and the platform validates tokens with the inline public JWK,
  # so the URL never needs to resolve. The ibac dataset's Token Introspect
  # `token-service-https-ibac-console` names this issuer.
  base_url: https://token-service.ibac-demo.local

idp:
  # Allow-list of what a token may be issued for (`aud` claim). Every gateway
  # asks for the console audience (JARVIS_TOKEN_SERVICE_AUDIENCE in
  # iag-base-docker.yaml), so the delegations carry the same audience as the
  # user's Auth0 access token and the platform validates both with Token
  # Introspects of that one audience. Anything else is refused with
  # invalid_target.
  audiences:
    - ibac-console
  # Delegation tokens are short-lived on purpose - nothing revokes them.
  token_ttl: 5m
  # act.type written into issued tokens; the IndyKite backend resolves the
  # actor in the graph with it.
  actor_type: Agent
  # Credentials callers (the gateways) present on the token endpoint.
  client_auth:
    type: client_secret_basic
    client_id: agent-gateway
    client_secret: "" # generate a secret and mirror it as TOKEN_SERVICE_CLIENT_SECRET in .env
  # First key signs; the rest stay published for rotation. The PUBLIC half
  # (kty/n/e/alg/kid/use) goes into instant-stack's TOKEN_SERVICE_PUBLIC_JWK
  # so the platform's Token Introspect validates the delegations offline.
  signing_keys:
    - '{"alg":"RS256","kid":"<kid>","kty":"RSA","use":"sig","n":"<...>","e":"AQAB","d":"<PRIVATE - generate your own>"}'

# Which incoming subject/actor tokens the exchange accepts, and how they are
# verified. Both come from the Auth0 tenant and are RS256 JWTs, verified
# offline against the tenant JWKS - the Token Service never calls Auth0's
# token endpoint. Replace the tenant domain with yours (AUTH0_DOMAIN in .env)
# in the issuer and jwks_uri of both entries; the trailing slash of the issuer
# is part of Auth0's `iss` value.
# `configurations` is a MAP keyed by the configuration name. There is no
# opaque fallback on purpose: a token of any other issuer is refused.
token_introspection:
  configurations:
    # The user's access token: the console logs in with
    # audience=ibac-console, so the token's `aud` names the console API. The
    # token's `sub` (auth0|...) is the Person external_id in the graph.
    auth0-subject:
      token_types:
        - subject_token
      matcher:
        type: jwt
        issuer: https://1st.eu.auth0.com/
        audience: ibac-console
      validation:
        offline:
          jwks_uri: https://1st.eu.auth0.com/.well-known/jwks.json
    # The gateways' actor tokens: a client-credentials grant of each gateway's
    # machine-to-machine application, issued for the ibac-agents API (the
    # bridge adds that audience). Its `sub` is <client_id>@clients, which is
    # what becomes act.sub in the delegation and what the Agent nodes carry.
    auth0-actor:
      token_types:
        - actor_token
      matcher:
        type: jwt
        issuer: https://1st.eu.auth0.com/
        audience: ibac-agents
      validation:
        offline:
          jwks_uri: https://1st.eu.auth0.com/.well-known/jwks.json

# Audit: every exchange attempt (authorized or not) is delivered to the demo's
# audit terminal - the same webhook the gateways use - so minting a delegation
# appears in the console stream beside the gateway authorization decisions.
# Messages carry decision, reason, subject, actor, the delegation chain, the
# trace id, and (on success) tokenID: the jti of the issued token.
audit:
  delivery: webhook
  http:
    url: http://chatbot:3300/api/push-update
    method: post
    auth:
      type: no-auth
  # Deliver in the background so auditing never adds latency to an exchange.
  async:
    buffersize: 100
