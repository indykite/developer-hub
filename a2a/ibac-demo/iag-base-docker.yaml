---
version: '3.9'

services:
  iag-base:
    # The demo runs Agent Gateway 2.108.1, a locally loaded image named in
    # .env as AGENT_GATEWAY_IMAGE; without it the published release 2.0.3,
    # pinned by digest, is pulled. What the demo relies on: MCP
    # proxying (JARVIS_PROTECTED_AGENT_PROTOCOL: mcp, used by mcp-iag,
    # drive-mcp-iag and erp-mcp-iag); token service mode with hop-by-hop
    # nesting of the incoming X-IK-Token, the per-gateway user-token audience
    # check and token_service.audience; the ibac.enabled switch that gates the
    # intent_agent section, the INTENT audit records and the gateway answering
    # a failed intent in place of the agent; the second exchange that puts the
    # intent into the delegated token (2.105 and later, with a Token Service
    # of the same release); admission decided by ONE AuthZEN
    # evaluation over the delegation chain ($ik_token.act_chain, policy
    # person-can-reach-agent in the dataset); MCP gateways serving one endpoint
    # with OAuth discovery; the delegated token extension on the agent cards,
    # the MCP capabilities and the protected resource metadata; and the
    # capability checks (CAN_USE on the Tool, McpResource, Prompt and Skill
    # nodes the dataset attaches to each agent per workflow), which filter
    # the MCP lists and the A2A extended card and refuse a tool, resource or
    # prompt outside the permitted set. All gateways share this image.
    image: ${AGENT_GATEWAY_IMAGE:-indykite/agent-gateway:2.0.3@sha256:8368f151cfec343f679dce6f320f43ab8c14cebb5465f683213de66c857aed33}
    environment:
      JARVIS_SERVICE_LOG_LEVEL: debug
      JARVIS_SERVICE_ENVIRONMENT: demo
      # Token Service mode, on every gateway: the delegation token is minted
      # at the self-hosted IndyKite Token Service instead of the IdP's
      # exchange endpoint. The user's own token stays in Authorization, the
      # delegation travels in X-IK-Token (policies read it as $ik_token), and
      # a gateway that receives an X-IK-Token introspects it at the Token
      # Service and nests it into the next exchange, so the act chain grows
      # hop by hop. The MCP gateways run the same mode because the platform
      # validates the X-IK-Token itself; a classic-mode gateway on the path
      # would drop the header and break the chain. The client credentials
      # must match token-service.yaml idp.client_auth.
      JARVIS_TOKEN_SERVICE_BASE_URL: ${TOKEN_SERVICE_BASE_URL:-http://token-service:8102}
      JARVIS_TOKEN_SERVICE_EXCHANGE_ENDPOINT: "oauth2/token"
      JARVIS_TOKEN_SERVICE_INTROSPECT_ENDPOINT: "oauth2/introspect"
      JARVIS_TOKEN_SERVICE_CLIENT_AUTH_TYPE: client_secret_basic
      JARVIS_TOKEN_SERVICE_CLIENT_AUTH_CLIENT_ID: ${TOKEN_SERVICE_CLIENT_ID:-agent-gateway}
      JARVIS_TOKEN_SERVICE_CLIENT_AUTH_CLIENT_SECRET: ${TOKEN_SERVICE_CLIENT_SECRET}
      # Without a resource detector the gateway skips its whole metrics
      # pipeline ("skip starting metrics server, no registry available");
      # "local" turns on Prometheus metrics at :9090/metrics (in-network only,
      # no host port is published).
      JARVIS_SERVICE_TRACING_DETECTOR: local
      # Identity provider = the Auth0 bridge (auth0_bridge/). A gateway
      # validates the user's access token only by RFC 7662 introspection,
      # under the same base URL as the client-credentials endpoint it gets
      # its actor token from; Auth0 offers no introspection endpoint and
      # refuses a client-credentials grant without an audience, which the
      # gateway does not send. The bridge answers both: introspection by
      # verifying Auth0's JWTs against the tenant JWKS, the token endpoint
      # by forwarding to Auth0 with the agents' audience added. The exchange
      # endpoint is unused in Token Service mode.
      JARVIS_IDENTITY_PROVIDER_BASE_URL: http://auth0-bridge:8090
      JARVIS_IDENTITY_PROVIDER_INTROSPECT_ENDPOINT: oauth/introspect
      JARVIS_IDENTITY_PROVIDER_CLIENT_CREDENTIAL_ENDPOINT: oauth/token
      JARVIS_IDENTITY_PROVIDER_EXCHANGE_ENDPOINT: oauth/token
      # Advertised in the public agent card as the security scheme callers
      # get their token from (A2A gateways), and named as the authorization
      # server in the OAuth protected resource metadata (MCP gateways).
      JARVIS_IDENTITY_PROVIDER_OPENID_CONFIGURATION_URL: https://${AUTH0_DOMAIN}/.well-known/openid-configuration
      JARVIS_IDENTITY_PROVIDER_ISSUER: https://${AUTH0_DOMAIN}/
      # A workflow starts only with a user token issued for the console
      # audience, and every delegation is minted for that same audience -
      # the one the dataset's two Token Introspects accept.
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_AUDIENCES: ${AUTH0_CONSOLE_AUDIENCE:-ibac-console}
      JARVIS_TOKEN_SERVICE_AUDIENCE: ${AUTH0_CONSOLE_AUDIENCE:-ibac-console}
      # ContX IQ resolves the subject of every request (whoami).
      JARVIS_CONTX_IQ_BASE_URL: ${INDYKITE_BASE_URL}/contx-iq/v1
      JARVIS_CONTX_IQ_APP_AGENT_CREDENTIALS_TOKEN: ${APP_AGENT_CREDENTIALS_TOKEN}
      # Admission: one AuthZEN evaluation per request - subject = whoami,
      # action CAN_TRIGGER, resource = the Agent node of this gateway's own
      # actor (the newest hop of the chain), the user token in Authorization
      # and the delegation in X-IK-Token; the dataset's person-can-reach-agent
      # policy compares $ik_token.act_chain with the workflow's path of
      # agents. To restrict a gateway to some workflows, write the restriction
      # into a tagged policy and send JARVIS_AUTHZEN_INPUT_PARAMS (JSON map)
      # and JARVIS_AUTHZEN_POLICY_TAGS (space-separated) here.
      JARVIS_AUTHZEN_BASE_URL: ${INDYKITE_BASE_URL}/access/v1
      JARVIS_AUTHZEN_ACTION: CAN_TRIGGER
      # Capability checks (on by default): an MCP gateway reads the set of
      # tools, resources and prompts the caller may use with one AuthZEN
      # search/resource per kind (action CAN_USE, resource types Tool,
      # McpResource, Prompt), filters the server's lists to it and refuses a
      # call outside it with 403 / -31403; an A2A gateway filters the skills
      # of the extended agent card (type Skill). The dataset attaches the
      # capabilities to each Agent with HAS {workflow_name} edges and the
      # person-can-use-* policies. false = every request gets the admission
      # decision only, the lists pass through unfiltered.
      JARVIS_AUTHZEN_CAPABILITIES_ENABLED: ${IAG_CAPABILITY_CHECKS:-true}
      # Admission decision cache: how long a gateway keeps a decision per
      # subject, agent and chain before asking the platform again, i.e. how
      # fast a grant or revoke reaches gateway decisions. Keep both values
      # equal. (The subject type comes from whoami; AUTHZEN_SUBJECT_TYPES is
      # read by the console and the ERP only.)
      JARVIS_AUTHZEN_CACHE_TTL: ${IAG_AUTHZEN_CACHE_TTL:-30s}
      JARVIS_AUTHZEN_CACHE_UPDATE_AFTER: ${IAG_AUTHZEN_CACHE_TTL:-30s}

    extra_hosts:
      - "host.docker.internal:host-gateway"
