---
info:
  name: Execute Store Decision Query
  type: http
  seq: 3

http:
  method: POST
  url: "{{ik_api_url_prefix}}/contx-iq/v1/execute"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-IK-ClientKey
      value: "{{agent_token}}"
  body:
    type: json
    data: |-
      {
          "id": "store-decision",
          "input_params": {
              "decision_external_id": "decision_002",
              "decision_description": "Refund approved as an exception to the refund policy",
              "document_external_id": "refund_policy",
              "ticket_external_id": "ticket_001"
          }
      }
  auth:
    type: bearer
    token: "{{user_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
