---
info:
  name: Exchange hop 3 - +mcp (full chain)
  type: http
  seq: 6

http:
  method: POST
  url: "{{token_service_url}}/oauth2/token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: "urn:ietf:params:oauth:grant-type:token-exchange"
      - name: subject_token
        value: "{{delegated_depth2}}"
      - name: subject_token_type
        value: "urn:ietf:params:oauth:token-type:access_token"
      - name: actor_token
        value: "{{actor_mcp}}"
      - name: actor_token_type
        value: "urn:ietf:params:oauth:token-type:access_token"
      - name: requested_token_type
        value: "urn:ietf:params:oauth:token-type:access_token"
  auth:
    type: basic
    username: agent-gateway
    password: "{{token_service_client_secret}}"

runtime:
  scripts:
    - type: after-response
      code: |
        var jsonData = res.body;

        test("Status code is 200", function () {
          expect(res.status).to.equal(200);
        });
        test("Token Service minted the full-chain delegated token", function () {
          expect(jsonData).to.have.property("access_token");
          expect(jsonData.access_token).to.be.a("string").and.not.to.be.empty;
        });

        // The full console->orchestrator->retriever->mcp shape the guard wants
        // (act.act.act.sub = indykiteagent) is proven authoritatively by
        // ciq-full-chain-allowed below returning documents - only a correct
        // depth-3 chain passes the token_filter.
        bru.setVar("delegated_depth3", jsonData.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
