---
# Token-service configuration for the iag-token-exchange demo.
# EXAMPLE - copy to token-service.yaml and fill in real keys/secrets.
# Reference for every field: jarvis services/.configs/services/token-service.yaml

service:
  name: token-service
  port: 8102
  environment: local
  log_level: debug
  # Issuer: the `iss` of every token this service signs. An identifier, not
  # necessarily reachable - relying parties are configured with it.
  # NOTE: must be https:// - the IndyKite platform routes third-party JWT
  # introspection only for https issuers (http issuers are treated as opaque
  # tokens). This is an identifier, not a transport address: the gateways
  # still call the service at http://token-service:8102 inside the compose
  # network, and the platform validates tokens with the inline public JWK,
  # so the URL never needs to resolve.
  base_url: https://token-service.demo.local

idp:
  # Allow-list of what a token may be issued for (`aud` claim): every
  # audience a subject token can carry plus every protected agent the
  # gateways exchange for. A missing one is refused with invalid_target.
  audiences:
    - agent-gateway
    - chatbot-mcp
    - indykiteagent
    - indykiteagent-2
    - indykiteagent-3
    - indykiteagent-4
    - indykiteagent-mcp
    - indykiteagent-drive
    - indykiteagent-crm
    - indykiteagent-erp
  # Delegation tokens are short-lived on purpose - nothing revokes them.
  token_ttl: 5m
  # act.type written into issued tokens; the IndyKite backend resolves the
  # actor in the graph with it.
  actor_type: Agent
  # Credentials callers (the gateways) present on the token endpoint.
  client_auth:
    type: client_secret_basic
    client_id: agent-gateway
    client_secret: "" # generate a secret and mirror it as TOKEN_SERVICE_CLIENT_SECRET in .env.<usecase>
  # First key signs; the rest stay published for rotation. The PUBLIC half
  # (kty/n/e/alg/kid/use) goes into instant-stack's TOKEN_SERVICE_PUBLIC_JWK
  # so the platform's Token Introspect validates the delegations offline.
  signing_keys:
    - '{"alg":"RS256","kid":"<kid>","kty":"RSA","use":"sig","n":"<...>","e":"AQAB","d":"<PRIVATE - generate your own>"}'

# Which incoming subject/actor tokens are accepted, and how they are verified.
# `configurations` is a MAP keyed by the configuration name.
token_introspection:
  configurations:
    # --- IdP (idsvr): one offline matcher per gateway actor audience ---
    # The actor token is the gateway's own client-credentials token; the
    # audience is the protected agent's IdP client id.
    idsvr-actor-orchestrator:
      token_types:
        - actor_token
      matcher:
        type: jwt
        issuer: https://idsvr.indykite.one/oauth/v2/oauth-anonymous
        audience: indykiteagent
      validation:
        offline:
          jwks_uri: https://idsvr.indykite.one/oauth/v2/oauth-anonymous/jwks
    idsvr-actor-retriever:
      token_types:
        - actor_token
      matcher:
        type: jwt
        issuer: https://idsvr.indykite.one/oauth/v2/oauth-anonymous
        audience: indykiteagent-2
      validation:
        offline:
          jwks_uri: https://idsvr.indykite.one/oauth/v2/oauth-anonymous/jwks
    idsvr-actor-weather:
      token_types:
        - actor_token
      matcher:
        type: jwt
        issuer: https://idsvr.indykite.one/oauth/v2/oauth-anonymous
        audience: indykiteagent-3
      validation:
        offline:
          jwks_uri: https://idsvr.indykite.one/oauth/v2/oauth-anonymous/jwks
    idsvr-actor-analyst:
      token_types:
        - actor_token
      matcher:
        type: jwt
        issuer: https://idsvr.indykite.one/oauth/v2/oauth-anonymous
        audience: indykiteagent-4
      validation:
        offline:
          jwks_uri: https://idsvr.indykite.one/oauth/v2/oauth-anonymous/jwks
    idsvr-actor-mcp:
      token_types:
        - actor_token
      matcher:
        type: jwt
        issuer: https://idsvr.indykite.one/oauth/v2/oauth-anonymous
        audience: indykiteagent-mcp
      validation:
        offline:
          jwks_uri: https://idsvr.indykite.one/oauth/v2/oauth-anonymous/jwks
    idsvr-actor-drive:
      token_types:
        - actor_token
      matcher:
        type: jwt
        issuer: https://idsvr.indykite.one/oauth/v2/oauth-anonymous
        audience: indykiteagent-drive
      validation:
        offline:
          jwks_uri: https://idsvr.indykite.one/oauth/v2/oauth-anonymous/jwks
    idsvr-actor-crm:
      token_types:
        - actor_token
      matcher:
        type: jwt
        issuer: https://idsvr.indykite.one/oauth/v2/oauth-anonymous
        audience: indykiteagent-crm
      validation:
        offline:
          jwks_uri: https://idsvr.indykite.one/oauth/v2/oauth-anonymous/jwks
    idsvr-actor-erp:
      token_types:
        - actor_token
      matcher:
        type: jwt
        issuer: https://idsvr.indykite.one/oauth/v2/oauth-anonymous
        audience: indykiteagent-erp
      validation:
        offline:
          jwks_uri: https://idsvr.indykite.one/oauth/v2/oauth-anonymous/jwks
    # --- Fallback: any other IdP token (user logins, any audience) ---
    # Opaque matchers catch what no jwt matcher above matched; validated
    # online at the IdP introspection endpoint with the orchestrator client.
    idsvr-online-subject:
      token_types:
        - subject_token
      matcher:
        type: opaque
      validation:
        online_oauth2:
          introspection_endpoint: https://idsvr.indykite.one/oauth/v2/oauth-introspect
          client_auth:
            type: client_secret_basic
            client_id: indykiteagent
            client_secret: "" # ORCHESTRATOR_IDP_CLIENT_SECRET
    idsvr-online-actor:
      token_types:
        - actor_token
      matcher:
        type: opaque
      validation:
        online_oauth2:
          introspection_endpoint: https://idsvr.indykite.one/oauth/v2/oauth-introspect
          client_auth:
            type: client_secret_basic
            client_id: indykiteagent
            client_secret: "" # ORCHESTRATOR_IDP_CLIENT_SECRET

# Audit: every exchange attempt (authorized or not) is delivered to the demo's
# audit terminal - the same webhook the gateways use - so minting a delegation
# appears in the console stream beside the gateway authorization decisions.
# Messages carry decision, reason, subject, actor, the delegation chain, the
# trace id, and (on success) tokenID: the jti of the issued token.
audit:
  delivery: webhook
  http:
    url: http://chatbot:3000/api/push-update
    method: post
    auth:
      type: no-auth
  # Deliver in the background so auditing never adds latency to an exchange.
  async:
    buffer_size: 100
