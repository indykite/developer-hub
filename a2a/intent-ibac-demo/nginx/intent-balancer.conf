events {}

http {
    upstream intent_agents {
        server intent-agent:6003;
        server intent-agent-2:6003;
    }

    server {
        listen 6003;

        location / {
            proxy_pass http://intent_agents;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_read_timeout 60s;
        }
    }
}
