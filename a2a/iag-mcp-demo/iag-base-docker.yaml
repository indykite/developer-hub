---
version: '3.9'

services:
  iag-base:
    # Agent Gateway release 2.112.0, as the image `agent-gateway:2.112.0` in
    # the local Docker daemon (load or tag the release build under that name);
    # .env may name another image as AGENT_GATEWAY_IMAGE. The newest release
    # on Docker Hub is
    # indykite/agent-gateway:2.0.3@sha256:8368f151cfec343f679dce6f320f43ab8c14cebb5465f683213de66c857aed33,
    # which runs with the same settings. Never use `latest`: on Docker Hub it
    # points at an older build. What the demo relies on: MCP proxying
    # (JARVIS_PROTECTED_AGENT_PROTOCOL: mcp, used by mcp-iag, drive-mcp-iag
    # and erp-mcp-iag) with one MCP endpoint per gateway and OAuth discovery;
    # admission decided by ONE AuthZEN evaluation over the delegation chain
    # ($ik_token.act_chain, policy *-can-reach-agent in the dataset); the
    # capability checks (CAN_USE on the Tool, McpResource, Prompt and Skill
    # nodes the dataset attaches to each agent per workflow); and the agent
    # cards the A2A gateways serve. All gateways share this image.
    # See https://hub.docker.com/r/indykite/agent-gateway/tags.
    image: ${AGENT_GATEWAY_IMAGE:-agent-gateway:2.112.0}
    environment:
      JARVIS_SERVICE_LOG_LEVEL: debug
      JARVIS_SERVICE_ENVIRONMENT: demo
      # Without a resource detector the gateway skips its whole metrics
      # pipeline ("skip starting metrics server, no registry available");
      # "local" turns on Prometheus metrics at :9090/metrics (in-network only,
      # no host port is published).
      JARVIS_SERVICE_TRACING_DETECTOR: local
      # Identity provider: introspects the bearer token, issues each gateway
      # its client-credentials (actor) token and mints the delegation token
      # (RFC 8693 token exchange). There is no token_service section, so the
      # delegation token replaces the bearer token in Authorization on the way
      # to the agent, and the next gateway receives it as its bearer token.
      JARVIS_IDENTITY_PROVIDER_BASE_URL: "${IDP_BASE_URL:-https://idsvr.indykite.one/oauth/v2/}"
      JARVIS_IDENTITY_PROVIDER_INTROSPECT_ENDPOINT: "oauth-introspect"
      JARVIS_IDENTITY_PROVIDER_CLIENT_CREDENTIAL_ENDPOINT: "oauth-token"
      JARVIS_IDENTITY_PROVIDER_EXCHANGE_ENDPOINT: "oauth-token"
      # Advertised in the agent cards the A2A gateways serve as the security
      # scheme callers get their token from, and named as the authorization
      # server in the OAuth protected resource metadata of the MCP gateways.
      # The issuer is written exactly as the `iss` of the IdP's tokens.
      JARVIS_IDENTITY_PROVIDER_OPENID_CONFIGURATION_URL: "${IDP_ISSUER:-https://idsvr.indykite.one/oauth/v2/oauth-anonymous}/.well-known/openid-configuration"
      JARVIS_IDENTITY_PROVIDER_ISSUER: "${IDP_ISSUER:-https://idsvr.indykite.one/oauth/v2/oauth-anonymous}"
      # ContX IQ resolves the subject of every request (whoami): node type
      # from the project's token introspect configuration, id from the token.
      JARVIS_CONTX_IQ_BASE_URL: ${INDYKITE_BASE_URL}/contx-iq/v1
      JARVIS_CONTX_IQ_APP_AGENT_CREDENTIALS_TOKEN: ${APP_AGENT_CREDENTIALS_TOKEN}
      # Admission: one AuthZEN evaluation per request - subject = whoami,
      # action CAN_TRIGGER, resource = the Agent node of this gateway's own
      # IdP client (the newest hop of the chain), with the delegation token in
      # X-IK-Token; the dataset's *-can-reach-agent policy compares
      # $ik_token.act_chain with the workflow's path of agents. To restrict a
      # gateway to some workflows, write the restriction into a tagged policy
      # and send JARVIS_AUTHZEN_INPUT_PARAMS (JSON map) and
      # JARVIS_AUTHZEN_POLICY_TAGS (space-separated) here.
      JARVIS_AUTHZEN_BASE_URL: ${INDYKITE_BASE_URL}/access/v1
      JARVIS_AUTHZEN_ACTION: CAN_TRIGGER
      # Capability checks: an MCP gateway reads the set of tools, resources
      # and prompts the caller may use with one AuthZEN search/resource per
      # kind (action CAN_USE, resource types Tool, McpResource, Prompt),
      # filters the server's lists to it and refuses a call outside it with
      # 403 / -31403; an A2A gateway filters the skills of the extended agent
      # card (type Skill). The dataset attaches the capabilities to each Agent
      # with HAS {workflow_name} edges and the *-can-use-* policies. false =
      # every request gets the admission decision only, the lists pass
      # through unfiltered.
      JARVIS_AUTHZEN_CAPABILITIES_ENABLED: ${IAG_CAPABILITY_CHECKS:-true}
      # Decision cache: how long a gateway keeps an admission decision and a
      # permitted set per subject and chain before asking the platform again,
      # i.e. how fast a grant or revoke reaches gateway decisions. Keep both
      # values equal. (The subject type comes from whoami; the console and
      # the ERP server read AUTHZEN_SUBJECT_TYPES, the gateways do not.)
      JARVIS_AUTHZEN_CACHE_TTL: ${IAG_AUTHZEN_CACHE_TTL:-30s}
      JARVIS_AUTHZEN_CACHE_UPDATE_AFTER: ${IAG_AUTHZEN_CACHE_TTL:-30s}

    extra_hosts:
      - "host.docker.internal:host-gateway"
