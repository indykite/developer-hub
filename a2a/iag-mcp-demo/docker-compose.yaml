---

# Build images with
#   docker build -t chatbot ./chatbot
#   docker build -t orchestrator-agent ./orchestrator_agent
#   docker build -t retriever-agent ./retriever_agent
#   docker build -t weather-agent ./weather_agent
#
# or use the make command

services:
  # Web UI
  chatbot:
    image: chatbot:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./chatbot/Dockerfile
    ports:
      - "${CHATBOT_PORT}:${CHATBOT_PORT}"
    networks:
      - console-network
      - orchestrator-iag-network
      - retriever-iag-network
      - weather-iag-network
      - mcp-iag-network
      - analyst-iag-network
      - drive-mcp-iag-network
      # Membership in every agent network lets the agents' exchanged-token
      # webhooks reach http://chatbot:3000 (harmless when a profile is off).
      - crm-iag-network
      - erp-mcp-iag-network
    volumes:
      - flask_session_data:/tmp/flask_session
    environment:
      CHATBOT_PORT: ${CHATBOT_PORT}
      ORCHESTRATOR_HOST: ${IAG_ORCHESTRATOR_HOST}
      ORCHESTRATOR_PORT: ${IAG_ORCHESTRATOR_PORT}
      ID_SERVER_BASE_URL: ${IDP_BASE_URL:-https://idsvr.indykite.one/oauth/v2/}
      ID_SERVER_TOKEN_ENDPOINT: oauth-token
      ID_SERVER_AUTHORIZE_ENDPOINT: oauth-authorize
      ID_SERVER_CLIENT_ID: ${CHATBOT_IDP_CLIENT_ID}
      ID_SERVER_CLIENT_SECRET: ${CHATBOT_IDP_CLIENT_SECRET}
      ID_SERVER_TOKEN_AUTH: basic
      CHATBOT_REDIRECT_URL: http://${CHATBOT_HOST}:${CHATBOT_PORT}/auth/callback
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      # "Explain the decision" (why? cards): the chatbot runs the two explain
      # CIQ queries against the platform with the app-agent credentials.
      # Feature hidden when the query ids are unset. The map derives a DENY
      # card's workflow id from its gateway name (deny reasons don't carry it).
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      APP_AGENT_CREDENTIALS_TOKEN: ${APP_AGENT_CREDENTIALS_TOKEN}
      EXPLAIN_STAFF_QUERY_ID: ${EXPLAIN_STAFF_QUERY_ID:-}
      EXPLAIN_DIRECT_QUERY_ID: ${EXPLAIN_DIRECT_QUERY_ID:-}
      EXPLAIN_WORKFLOW_MAP: >-
        orchestrator-iag=${WORKFLOW_ID},retriever-iag=${WORKFLOW_ID},
        mcp-iag=${WORKFLOW_ID},weather-iag=${WEATHER_WORKFLOW_ID:-},
        analyst-iag=${ANALYST_WORKFLOW_ID:-},crm-iag=${CRM_WORKFLOW_ID:-},
        drive-mcp-iag=${DRIVE_WORKFLOW_ID:-},erp-mcp-iag=${ERP_WORKFLOW_ID:-}
      # Architecture page (/static/architecture.html): badge the active
      # usecase and dim the drive/crm/erp groups when their profile is off.
      USECASE: ${USECASE:-canbank}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # Deny -> remediate -> allow: gateways whose DENY cards offer a
      # one-click CAN_TRIGGER grant, and the workflow bundle one click writes
      # (empty = feature off). The grant is guarded by a live AuthZEN
      # self-check on the logged-in user.
      AUTHZEN_SUBJECT_TYPES: ${AUTHZEN_SUBJECT_TYPES:-User}
      GRANT_WORKFLOW_MAP: ${GRANT_WORKFLOW_MAP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python app.py --host 0.0.0.0 --port ${CHATBOT_PORT}

  # Protects Orchestrator
  orchestrator-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_ORCHESTRATOR_PORT}:${IAG_ORCHESTRATOR_PORT}"
    networks:
      - orchestrator-iag-network
    environment:
      K_SERVICE: orchestrator-iag
      JARVIS_SERVICE_NAME: orchestrator-iag
      JARVIS_SERVICE_PORT: ${IAG_ORCHESTRATOR_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${ORCHESTRATOR_HOST}:${ORCHESTRATOR_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${ORCHESTRATOR_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${ORCHESTRATOR_IDP_CLIENT_SECRET}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  orchestrator:
    image: orchestrator-agent:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./orchestrator_agent/Dockerfile
    # Usecase bundle: domain vocabulary (env) + skills (volume). Switch demos
    # with USECASE=<name> in .env; see usecases/README.md.
    env_file:
      - ./usecases/${USECASE:-canbank}/usecase.env
    volumes:
      - ./usecases/${USECASE:-canbank}/skills/orchestrator:/app/skills:ro
    ports:
      - "${ORCHESTRATOR_PORT}:${ORCHESTRATOR_PORT}"
    networks:
      - orchestrator-iag-network
      - retriever-iag-network
      - weather-iag-network
      - analyst-iag-network
      - crm-iag-network
    environment:
      ADVERTISED_HOST: ${ORCHESTRATOR_HOST}
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT}
      ORCHESTRATOR_AGENT_NAME: orchestrator_agent
      RETRIEVER_HOST: ${IAG_RETRIEVER_HOST}
      RETRIEVER_PORT: ${IAG_RETRIEVER_PORT}
      WEATHER_HOST: ${IAG_WEATHER_HOST}
      WEATHER_PORT: ${IAG_WEATHER_PORT}
      # Routes query_drive (console -> orchestrator -> analyst -> drive-mcp-iag)
      # through the analyst gateway; leave empty to disable the Drive tool.
      ANALYST_HOST: ${IAG_ANALYST_HOST}
      ANALYST_PORT: ${IAG_ANALYST_PORT}
      # Routes query_crm (console -> orchestrator -> crm-iag -> crm agent ->
      # Salesforce) through the CRM gateway; leave empty to disable the tool.
      CRM_HOST: ${IAG_CRM_HOST:-}
      CRM_PORT: ${IAG_CRM_PORT:-8888}
      # Enables query_erp (invoices via the analyst's erp_* backend); set
      # true in the usecase env once the erp profile + backend are wired.
      ERP_TOOL_ENABLED: ${ERP_TOOL_ENABLED:-}
      GEMINI_ENABLED: ${GEMINI_ENABLED}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_MODEL: ${LOCAL_LLM_MODEL}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/mcp/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects Retriever
  retriever-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_RETRIEVER_PORT}:${IAG_RETRIEVER_PORT}"
    networks:
      - retriever-iag-network
    environment:
      K_SERVICE: retriever-iag
      JARVIS_SERVICE_NAME: retriever-iag
      JARVIS_SERVICE_PORT: ${IAG_RETRIEVER_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${RETRIEVER_HOST}:${RETRIEVER_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${RETRIEVER_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${RETRIEVER_IDP_CLIENT_SECRET}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  retriever:
    image: retriever-agent:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./retriever_agent/Dockerfile
    env_file:
      - ./usecases/${USECASE:-canbank}/usecase.env
    volumes:
      - ./usecases/${USECASE:-canbank}/skills/retriever:/app/skills:ro
    ports:
      - "${RETRIEVER_PORT}:${RETRIEVER_PORT}"
    networks:
      - retriever-iag-network
      - mcp-iag-network
    environment:
      ADVERTISED_HOST: ${RETRIEVER_HOST}
      RETRIEVER_PORT: ${RETRIEVER_PORT}
      RETRIEVER_AGENT_NAME: retriever_agent
      # Route MCP calls through the MCP-protecting IAG instead of the MCP server
      # directly. To bypass the IAG, set this back to ${MCP_SERVER_URL}.
      MCP_SERVER_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      # Reuse window (seconds) for the per-user MCP session; 0 = new session
      # per request. Keep below the access-token lifetime.
      MCP_SESSION_TTL: ${MCP_SESSION_TTL:-300}
      GEMINI_ENABLED: ${GEMINI_ENABLED}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_MODEL: ${LOCAL_LLM_MODEL}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/mcp/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects Weather
  weather-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_WEATHER_PORT}:${IAG_WEATHER_PORT}"
    networks:
      - weather-iag-network
    environment:
      K_SERVICE: weather-iag
      JARVIS_SERVICE_NAME: weather-iag
      JARVIS_SERVICE_PORT: ${IAG_WEATHER_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${WEATHER_HOST}:${WEATHER_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${WEATHER_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${WEATHER_IDP_CLIENT_SECRET}
      # The weather agent runs wf2 (weather -> mcp), not the base ${WORKFLOW_ID}
      # (wf1). allowed_workflow_id is a single value per gateway.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ${WEATHER_WORKFLOW_ID}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  #  Protects Analyst
  analyst-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_ANALYST_PORT}:${IAG_ANALYST_PORT}"
    networks:
      - analyst-iag-network
    environment:
      K_SERVICE: analyst-iag
      JARVIS_SERVICE_NAME: analyst-iag
      JARVIS_SERVICE_PORT: ${IAG_ANALYST_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${ANALYST_HOST}:${ANALYST_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${ANALYST_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${ANALYST_IDP_CLIENT_SECRET}
      # The analyst runs its own workflow (wf3: millicent -> analyst -> mcp), not the
      # base ${WORKFLOW_ID} (wf1). allowed_workflow_id is a single value per gateway.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ${ANALYST_WORKFLOW_ID}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  analyst:
    image: analyst-agent:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./analyst_agent/Dockerfile
    env_file:
      - ./usecases/${USECASE:-canbank}/usecase.env
    volumes:
      - ./usecases/${USECASE:-canbank}/skills/analyst:/app/skills:ro
    ports:
      - "${ANALYST_PORT}:${ANALYST_PORT}"
    networks:
      - analyst-iag-network
      - mcp-iag-network
      # Membership in the drive/erp gateway networks is harmless while their
      # profiles are off; it only matters when ANALYST_MCP_SERVER_URLS adds
      # those backends.
      - drive-mcp-iag-network
      - erp-mcp-iag-network
    environment:
      ADVERTISED_HOST: ${ANALYST_HOST}
      ANALYST_PORT: ${ANALYST_PORT}
      ANALYST_AGENT_NAME: analyst_agent
      # Route MCP calls through the MCP-protecting IAG instead of the MCP server
      # directly. To bypass the IAG, set this back to ${MCP_SERVER_URL}.
      MCP_SERVER_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      # Multi-backend mode: comma-separated alias=url pairs (see .example.env).
      # When set, this overrides MCP_SERVER_URL and tool names get the alias as
      # prefix (indykite_ciq_execute, drive_search, ...).
      MCP_SERVER_URLS: ${ANALYST_MCP_SERVER_URLS:-}
      # Reuse window (seconds) for per-user MCP sessions; 0 = new session per
      # request. Keep below the access-token lifetime.
      MCP_SESSION_TTL: ${MCP_SESSION_TTL:-300}
      GEMINI_ENABLED: ${GEMINI_ENABLED}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_MODEL: ${LOCAL_LLM_MODEL}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/mcp/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects the CRM agent (Salesforce cases; insurance usecase only - leave
  #  IAG_CRM_HOST empty in usecases without a CRM story to disable the route)
  crm-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    # Started only for usecases that enable the "crm" profile in their env
    # file (COMPOSE_PROFILES in .env.<usecase>); the switch script's
    # --remove-orphans stops the pair when switching to a usecase without it.
    profiles: ["crm"]
    ports:
      - "${IAG_CRM_PORT:-8888}:${IAG_CRM_PORT:-8888}"
    networks:
      - crm-iag-network
    environment:
      K_SERVICE: crm-iag
      JARVIS_SERVICE_NAME: crm-iag
      JARVIS_SERVICE_PORT: ${IAG_CRM_PORT:-8888}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${CRM_HOST:-crm}:${CRM_PORT:-6006}
      # Defaults keep `docker compose up` warning-free with a .env predating
      # the CRM pair - compose validates these specs even when the profile is
      # disabled (same convention as the drive PoC).
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${CRM_IDP_CLIENT_ID:-}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${CRM_IDP_CLIENT_SECRET:-}
      # The CRM agent runs its own workflow (wf-crm: staff -> orchestrator ->
      # crm), not the base ${WORKFLOW_ID}. allowed_workflow_id is one value per
      # gateway.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ${CRM_WORKFLOW_ID:-wf-crm}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  crm:
    image: crm-agent:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./crm_agent/Dockerfile
    profiles: ["crm"]
    env_file:
      - ./usecases/${USECASE:-canbank}/usecase.env
    # Deliberately NOT published to the host: the agent trusts the delegation
    # token it receives because crm-iag minted and verified it. A host port
    # would allow bypassing the gateway with a self-crafted JWT, whose spoofed
    # sub/act would be written into Salesforce as attribution. Only crm-iag
    # reaches it, over the internal network.
    networks:
      - crm-iag-network
    environment:
      ADVERTISED_HOST: ${CRM_HOST:-crm}
      CRM_PORT: ${CRM_PORT:-6006}
      CRM_AGENT_NAME: crm_agent
      # Salesforce connected app (OAuth 2.0 JWT Bearer flow, RFC 7523). The
      # private key pairs with the certificate uploaded to the connected app;
      # mounted read-only from ./crm_agent/keys (gitignored).
      SF_LOGIN_URL: ${SF_LOGIN_URL:-https://login.salesforce.com}
      SF_CONSUMER_KEY: ${SF_CONSUMER_KEY:-}
      SF_USERNAME: ${SF_USERNAME:-}
      SF_PRIVATE_KEY_FILE: ${SF_PRIVATE_KEY_FILE:-/app/keys/sf-jwt.key}
      SF_API_VERSION: ${SF_API_VERSION:-v61.0}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
    volumes:
      - ./crm_agent/keys:/app/keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects the MCP server (MCP-protocol proxy mode)
  #  Single shared gateway that the retriever and weather agents call instead of
  #  hitting the MCP server directly, so MCP traffic is subject to the same
  #  token introspection, AuthZEN authorization and audit logging as the A2A flows.
  mcp-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_MCP_PORT}:${IAG_MCP_PORT}"
    networks:
      - mcp-iag-network
    environment:
      K_SERVICE: mcp-iag
      JARVIS_SERVICE_NAME: mcp-iag
      JARVIS_SERVICE_PORT: ${IAG_MCP_PORT}
      # Switch the gateway out of the default "a2a" proxy mode into MCP proxy mode.
      JARVIS_PROTECTED_AGENT_PROTOCOL: mcp
      # Downstream MCP server. Only the origin is needed: the gateway forwards the
      # incoming request path (e.g. /mcp/v1/<project>) on top of this base URL.
      JARVIS_PROTECTED_AGENT_BASE_URL: ${MCP_SERVER_ORIGIN}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${MCP_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${MCP_IDP_CLIENT_SECRET}
      # Three workflows converge on the MCP agent (wf1 retriever, wf2 weather,
      # wf3 analyst) but allowed_workflow_id accepts a single value, so leave it
      # empty here: the gateway then allows any workflow resolved from the graph.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ""
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  weather:
    image: weather-agent:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./weather_agent/Dockerfile
    env_file:
      - ./usecases/${USECASE:-canbank}/usecase.env
    ports:
      - "${WEATHER_PORT}:${WEATHER_PORT}"
    networks:
      - weather-iag-network
      - mcp-iag-network
    environment:
      ADVERTISED_HOST: ${WEATHER_HOST}
      WEATHER_PORT: ${WEATHER_PORT}
      WEATHER_AGENT_NAME: weather_agent
      # Route MCP calls through the MCP-protecting IAG instead of the MCP server
      # directly. To bypass the IAG, set this back to ${MCP_SERVER_URL}.
      MCP_SERVER_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      # Reuse window (seconds) for the per-user MCP session; 0 = new session
      # per request. Keep below the access-token lifetime.
      MCP_SESSION_TTL: ${MCP_SESSION_TTL:-300}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      CIQ_QUERY_HQ_WEATHER: ${CIQ_QUERY_HQ_WEATHER:-get-hq-weather}
      LOG_LEVEL: ${LOG_LEVEL}
      # Third-party (a2a/mcp/httpx) log level; DEBUG shows SDK event breadcrumbs.
      LIB_LOG_LEVEL: ${LIB_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Google Drive MCP proof-of-concept (compose profile "drive"):
  #  the reference stdio Drive MCP server wrapped by supergateway into
  #  Streamable HTTP, protected by its own IAG in MCP proxy mode.
  #  The Drive server holds its OWN Google credentials (mounted below); the
  #  gateway strips the caller's Authorization and injects its IdP delegation
  #  token, which this downstream ignores. Start with:
  #    docker compose --profile drive up
  drive-mcp-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    profiles: ["drive"]
    # Defaults on every ${DRIVE_*} var keep `docker compose up` working with a
    # .env predating this PoC - compose validates these specs even when the
    # profile is disabled.
    ports:
      - "${IAG_DRIVE_MCP_PORT:-8887}:${IAG_DRIVE_MCP_PORT:-8887}"
    networks:
      - drive-mcp-iag-network
    environment:
      K_SERVICE: drive-mcp-iag
      JARVIS_SERVICE_NAME: drive-mcp-iag
      JARVIS_SERVICE_PORT: ${IAG_DRIVE_MCP_PORT:-8887}
      # MCP proxy mode, same as mcp-iag.
      JARVIS_PROTECTED_AGENT_PROTOCOL: mcp
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${DRIVE_MCP_HOST:-drive-mcp}:${DRIVE_MCP_PORT:-8000}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${DRIVE_MCP_IDP_CLIENT_ID:-indykiteagent-drive}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${DRIVE_MCP_IDP_CLIENT_SECRET:-}
      # The drive gateway serves one workflow per call shape (wf-drive direct,
      # wf-drive-analyst via the analyst, wf-drive-console via the console
      # chain). allowed_workflow_id is single-valued, so it stays unpinned
      # (same as mcp-iag); set DRIVE_WORKFLOW_ID to pin a single shape.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ${DRIVE_WORKFLOW_ID:-}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  drive-mcp:
    image: drive-mcp:latest
    #    build:
    #      context: .
    #      dockerfile: ./drive_mcp/Dockerfile
    profiles: ["drive"]
    ports:
      - "${DRIVE_MCP_PORT:-8000}:8000"
    networks:
      - drive-mcp-iag-network
    environment:
      # Paths to the mounted Google OAuth material (values are paths, not secrets).
      GDRIVE_OAUTH_PATH: /gdrive/gcp-oauth.keys.json
      GDRIVE_CREDENTIALS_PATH: /gdrive/.gdrive-server-credentials.json
    volumes:
      # Google OAuth material - see drive_mcp/README.md for the auth bootstrap.
      - ./drive_mcp/.gdrive:/gdrive:ro

  #  Protects the ERP MCP server (MCP-protocol proxy mode). Optional "erp"
  #  profile: a Postgres invoices table whose rows are pre-filtered per caller
  #  by AuthZEN search/resource before any SQL runs - same prompt, different
  #  rows, and the database knows nothing about the graph.
  erp-mcp-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    profiles: ["erp"]
    ports:
      - "${IAG_ERP_MCP_PORT:-8889}:${IAG_ERP_MCP_PORT:-8889}"
    networks:
      # Client-facing net (analyst/chatbot) + the private backend net where
      # erp-mcp and erp-db live - this gateway is the only bridge between them.
      - erp-mcp-iag-network
      - erp-backend-network
    environment:
      K_SERVICE: erp-mcp-iag
      JARVIS_SERVICE_NAME: erp-mcp-iag
      JARVIS_SERVICE_PORT: ${IAG_ERP_MCP_PORT:-8889}
      JARVIS_PROTECTED_AGENT_PROTOCOL: mcp
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${ERP_MCP_HOST:-erp-mcp}:${ERP_MCP_PORT:-8010}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${ERP_MCP_IDP_CLIENT_ID:-indykiteagent-erp}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${ERP_MCP_IDP_CLIENT_SECRET:-}
      # Left empty: three workflow shapes (wf-erp / wf-erp-analyst /
      # wf-erp-console) converge on this gateway and allowed_workflow_id is
      # single-valued - same trick as the drive gateway.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ${ERP_WORKFLOW_ID:-}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  erp-mcp:
    image: erp-mcp:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./erp_mcp/Dockerfile
    profiles: ["erp"]
    # Trust boundary, enforced by topology: the server trusts the delegation
    # token's subject because erp-mcp-iag minted and verified it - so nothing
    # else may reach it (a direct caller could forge a JWT and read other
    # subjects' rows). No host port, and membership ONLY in the private
    # backend net, which clients (analyst/chatbot) are not on; the gateway
    # is the sole bridge.
    networks:
      - erp-backend-network
    environment:
      ERP_MCP_PORT: ${ERP_MCP_PORT:-8010}
      ERP_DB_DSN: postgresql://erp:erp@erp-db:5432/erp
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      APP_AGENT_CREDENTIALS_TOKEN: ${APP_AGENT_CREDENTIALS_TOKEN}
      # Subject node type for the AuthZEN search (insurance: Person,
      # canbank: default User); reuses the gateways' subject-type env.
      ERP_SUBJECT_TYPE: ${AUTHZEN_SUBJECT_TYPES:-User}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - erp-db

  erp-db:
    image: postgres:16-alpine
    profiles: ["erp"]
    # Private backend net only - reached exclusively by erp-mcp.
    networks:
      - erp-backend-network
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    volumes:
      - ./erp_mcp/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - erp_db_data:/var/lib/postgresql/data

networks:
  console-network:
    driver: bridge
  orchestrator-iag-network:
    driver: bridge
  retriever-iag-network:
    driver: bridge
  weather-iag-network:
    driver: bridge
  analyst-iag-network:
    driver: bridge
  crm-iag-network:
    driver: bridge
  mcp-iag-network:
    driver: bridge
  drive-mcp-iag-network:
    driver: bridge
  erp-mcp-iag-network:
    driver: bridge
  # Private net for erp-mcp + erp-db; only the erp gateway bridges into it.
  # A normal bridge (not internal:true) so erp-mcp keeps egress to the
  # platform's search/resource API.
  erp-backend-network:
    driver: bridge

volumes:
  flask_session_data: {}
  erp_db_data: {}
