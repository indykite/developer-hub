---

# Build images with
#   docker build -t chatbot ./chatbot
#   docker build -t orchestrator-agent ./orchestrator_agent
#   docker build -t retriever-agent ./retriever_agent
#   docker build -t weather-agent ./weather_agent
#
# or use the make command

services:
  # Web UI
  chatbot:
    image: chatbot:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./chatbot/Dockerfile
    ports:
      - "${CHATBOT_PORT}:${CHATBOT_PORT}"
    networks:
      - console-network
      - orchestrator-iag-network
      - retriever-iag-network
      - weather-iag-network
      - mcp-iag-network
      - analyst-iag-network
      - drive-mcp-iag-network
    volumes:
      - flask_session_data:/tmp/flask_session
    environment:
      CHATBOT_PORT: ${CHATBOT_PORT}
      ORCHESTRATOR_HOST: ${IAG_ORCHESTRATOR_HOST}
      ORCHESTRATOR_PORT: ${IAG_ORCHESTRATOR_PORT}
      ID_SERVER_BASE_URL: ${IDP_BASE_URL:-https://idsvr.indykite.one/oauth/v2/}
      ID_SERVER_TOKEN_ENDPOINT: oauth-token
      ID_SERVER_AUTHORIZE_ENDPOINT: oauth-authorize
      ID_SERVER_CLIENT_ID: ${CHATBOT_IDP_CLIENT_ID}
      ID_SERVER_CLIENT_SECRET: ${CHATBOT_IDP_CLIENT_SECRET}
      ID_SERVER_TOKEN_AUTH: basic
      CHATBOT_REDIRECT_URL: http://${CHATBOT_HOST}:${CHATBOT_PORT}/auth/callback
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python app.py --host 0.0.0.0 --port ${CHATBOT_PORT}

  # Protects Orchestrator
  orchestrator-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_ORCHESTRATOR_PORT}:${IAG_ORCHESTRATOR_PORT}"
    networks:
      - orchestrator-iag-network
    environment:
      K_SERVICE: orchestrator-iag
      JARVIS_SERVICE_NAME: orchestrator-iag
      JARVIS_SERVICE_PORT: ${IAG_ORCHESTRATOR_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${ORCHESTRATOR_HOST}:${ORCHESTRATOR_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${ORCHESTRATOR_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${ORCHESTRATOR_IDP_CLIENT_SECRET}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  orchestrator:
    image: orchestrator-agent:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./orchestrator_agent/Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT}:${ORCHESTRATOR_PORT}"
    networks:
      - orchestrator-iag-network
      - retriever-iag-network
      - weather-iag-network
    environment:
      ADVERTISED_HOST: ${ORCHESTRATOR_HOST}
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT}
      ORCHESTRATOR_AGENT_NAME: orchestrator_agent
      RETRIEVER_HOST: ${IAG_RETRIEVER_HOST}
      RETRIEVER_PORT: ${IAG_RETRIEVER_PORT}
      WEATHER_HOST: ${IAG_WEATHER_HOST}
      WEATHER_PORT: ${IAG_WEATHER_PORT}
      GEMINI_ENABLED: ${GEMINI_ENABLED}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_MODEL: ${LOCAL_LLM_MODEL}
      LOG_LEVEL: ${LOG_LEVEL}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects Retriever
  retriever-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_RETRIEVER_PORT}:${IAG_RETRIEVER_PORT}"
    networks:
      - retriever-iag-network
    environment:
      K_SERVICE: retriever-iag
      JARVIS_SERVICE_NAME: retriever-iag
      JARVIS_SERVICE_PORT: ${IAG_RETRIEVER_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${RETRIEVER_HOST}:${RETRIEVER_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${RETRIEVER_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${RETRIEVER_IDP_CLIENT_SECRET}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  retriever:
    image: retriever-agent:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./retriever_agent/Dockerfile
    ports:
      - "${RETRIEVER_PORT}:${RETRIEVER_PORT}"
    networks:
      - retriever-iag-network
      - mcp-iag-network
    environment:
      ADVERTISED_HOST: ${RETRIEVER_HOST}
      RETRIEVER_PORT: ${RETRIEVER_PORT}
      RETRIEVER_AGENT_NAME: retriever_agent
      # Route MCP calls through the MCP-protecting IAG instead of the MCP server
      # directly. To bypass the IAG, set this back to ${MCP_SERVER_URL}.
      MCP_SERVER_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      GEMINI_ENABLED: ${GEMINI_ENABLED}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_MODEL: ${LOCAL_LLM_MODEL}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects Weather
  weather-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_WEATHER_PORT}:${IAG_WEATHER_PORT}"
    networks:
      - weather-iag-network
    environment:
      K_SERVICE: weather-iag
      JARVIS_SERVICE_NAME: weather-iag
      JARVIS_SERVICE_PORT: ${IAG_WEATHER_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${WEATHER_HOST}:${WEATHER_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${WEATHER_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${WEATHER_IDP_CLIENT_SECRET}
      # The weather agent runs wf2 (weather -> mcp), not the base ${WORKFLOW_ID}
      # (wf1). allowed_workflow_id is a single value per gateway.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ${WEATHER_WORKFLOW_ID}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  #  Protects Analyst
  analyst-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_ANALYST_PORT}:${IAG_ANALYST_PORT}"
    networks:
      - analyst-iag-network
    environment:
      K_SERVICE: analyst-iag
      JARVIS_SERVICE_NAME: analyst-iag
      JARVIS_SERVICE_PORT: ${IAG_ANALYST_PORT}
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${ANALYST_HOST}:${ANALYST_PORT}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${ANALYST_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${ANALYST_IDP_CLIENT_SECRET}
      # The analyst runs its own workflow (wf3: millicent -> analyst -> mcp), not the
      # base ${WORKFLOW_ID} (wf1). allowed_workflow_id is a single value per gateway.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ${ANALYST_WORKFLOW_ID}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  analyst:
    image: analyst-agent:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./analyst_agent/Dockerfile
    ports:
      - "${ANALYST_PORT}:${ANALYST_PORT}"
    networks:
      - analyst-iag-network
      - mcp-iag-network
    environment:
      ADVERTISED_HOST: ${ANALYST_HOST}
      ANALYST_PORT: ${ANALYST_PORT}
      ANALYST_AGENT_NAME: analyst_agent
      # Route MCP calls through the MCP-protecting IAG instead of the MCP server
      # directly. To bypass the IAG, set this back to ${MCP_SERVER_URL}.
      MCP_SERVER_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      GEMINI_ENABLED: ${GEMINI_ENABLED}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      LLM_MODEL: ${LOCAL_LLM_MODEL}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Protects the MCP server (MCP-protocol proxy mode)
  #  Single shared gateway that the retriever and weather agents call instead of
  #  hitting the MCP server directly, so MCP traffic is subject to the same
  #  token introspection, AuthZEN authorization and audit logging as the A2A flows.
  mcp-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    ports:
      - "${IAG_MCP_PORT}:${IAG_MCP_PORT}"
    networks:
      - mcp-iag-network
    environment:
      K_SERVICE: mcp-iag
      JARVIS_SERVICE_NAME: mcp-iag
      JARVIS_SERVICE_PORT: ${IAG_MCP_PORT}
      # Switch the gateway out of the default "a2a" proxy mode into MCP proxy mode.
      JARVIS_PROTECTED_AGENT_PROTOCOL: mcp
      # Downstream MCP server. Only the origin is needed: the gateway forwards the
      # incoming request path (e.g. /mcp/v1/<project>) on top of this base URL.
      JARVIS_PROTECTED_AGENT_BASE_URL: ${MCP_SERVER_ORIGIN}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${MCP_IDP_CLIENT_ID}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${MCP_IDP_CLIENT_SECRET}
      # Three workflows converge on the MCP agent (wf1 retriever, wf2 weather,
      # wf3 analyst) but allowed_workflow_id accepts a single value, so leave it
      # empty here: the gateway then allows any workflow resolved from the graph.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ""
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  weather:
    image: weather-agent:latest
    #    platform: linux/amd64
    #    build:
    #      context: .
    #      dockerfile: ./weather_agent/Dockerfile
    ports:
      - "${WEATHER_PORT}:${WEATHER_PORT}"
    networks:
      - weather-iag-network
      - mcp-iag-network
    environment:
      ADVERTISED_HOST: ${WEATHER_HOST}
      WEATHER_PORT: ${WEATHER_PORT}
      WEATHER_AGENT_NAME: weather_agent
      # Route MCP calls through the MCP-protecting IAG instead of the MCP server
      # directly. To bypass the IAG, set this back to ${MCP_SERVER_URL}.
      MCP_SERVER_URL: http://${IAG_MCP_HOST}:${IAG_MCP_PORT}${MCP_SERVER_PATH}
      INDYKITE_BASE_URL: ${INDYKITE_BASE_URL}
      CIQ_QUERY_HQ_WEATHER: ${CIQ_QUERY_HQ_WEATHER:-get-hq-weather}
      LOG_LEVEL: ${LOG_LEVEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  #  Google Drive MCP proof-of-concept (compose profile "drive"):
  #  the reference stdio Drive MCP server wrapped by supergateway into
  #  Streamable HTTP, protected by its own IAG in MCP proxy mode.
  #  The Drive server holds its OWN Google credentials (mounted below); the
  #  gateway strips the caller's Authorization and injects its IdP delegation
  #  token, which this downstream ignores. Start with:
  #    docker compose --profile drive up
  drive-mcp-iag:
    extends:
      service: iag-base
      file: iag-base-docker.yaml
    profiles: ["drive"]
    # Defaults on every ${DRIVE_*} var keep `docker compose up` working with a
    # .env predating this PoC - compose validates these specs even when the
    # profile is disabled.
    ports:
      - "${IAG_DRIVE_MCP_PORT:-8887}:${IAG_DRIVE_MCP_PORT:-8887}"
    networks:
      - drive-mcp-iag-network
    environment:
      K_SERVICE: drive-mcp-iag
      JARVIS_SERVICE_NAME: drive-mcp-iag
      JARVIS_SERVICE_PORT: ${IAG_DRIVE_MCP_PORT:-8887}
      # MCP proxy mode, same as mcp-iag.
      JARVIS_PROTECTED_AGENT_PROTOCOL: mcp
      JARVIS_PROTECTED_AGENT_BASE_URL: http://${DRIVE_MCP_HOST:-drive-mcp}:${DRIVE_MCP_PORT:-8000}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_ID: ${DRIVE_MCP_IDP_CLIENT_ID:-indykiteagent-drive}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_CLIENT_SECRET: ${DRIVE_MCP_IDP_CLIENT_SECRET:-}
      # The drive workflow (millicent -> drive) is separate from the base wf1.
      JARVIS_CONTX_IQ_ALLOWED_WORKFLOW_ID: ${DRIVE_WORKFLOW_ID:-wf-drive}
    volumes:
      - ./audit-config.yaml:/app/.configs/audit-config.yaml
    command: ["--config=/app/.configs/audit-config.yaml"]

  drive-mcp:
    image: drive-mcp:latest
    #    build:
    #      context: .
    #      dockerfile: ./drive_mcp/Dockerfile
    profiles: ["drive"]
    ports:
      - "${DRIVE_MCP_PORT:-8000}:8000"
    networks:
      - drive-mcp-iag-network
    environment:
      # Paths to the mounted Google OAuth material (values are paths, not secrets).
      GDRIVE_OAUTH_PATH: /gdrive/gcp-oauth.keys.json
      GDRIVE_CREDENTIALS_PATH: /gdrive/.gdrive-server-credentials.json
    volumes:
      # Google OAuth material - see drive_mcp/README.md for the auth bootstrap.
      - ./drive_mcp/.gdrive:/gdrive:ro

networks:
  console-network:
    driver: bridge
  orchestrator-iag-network:
    driver: bridge
  retriever-iag-network:
    driver: bridge
  weather-iag-network:
    driver: bridge
  analyst-iag-network:
    driver: bridge
  mcp-iag-network:
    driver: bridge
  drive-mcp-iag-network:
    driver: bridge

volumes:
  flask_session_data: {}
