---
info:
  name: Create Customer CAN_VIEW Own Invoice Policy
  type: http
  seq: 4

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/authorization-policies"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "name": "customer-own-invoice",
          "display_name": "Customer sees own invoice",
          "description": "A logged-in user may view the invoices of the customer record they own.",
          "project_id": "{{project_id}}",
          "policy": "{\"meta\": {\"policy_version\": \"2.0-kbac\"}, \"subject\": {\"type\": \"User\"}, \"actions\": [\"CAN_VIEW\"], \"resource\": {\"type\": \"Invoice\"}, \"condition\": {\"cypher\": \"MATCH (subject:User)-[:IS_CUSTOMER]->(:Customer)-[:HAS_INVOICE]->(resource:Invoice)\"}}",
          "status": "ACTIVE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
