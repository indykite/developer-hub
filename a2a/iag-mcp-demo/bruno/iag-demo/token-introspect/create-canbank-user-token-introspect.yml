---
info:
  name: Create CanBank User Token Introspect
  type: http
  seq: 2

http:
  method: POST
  url: "{{ik_api_url_prefix}}/configs/v1/token-introspects"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "project_id": "{{project_id}}",
        "name": "canbank-user-token-introspect",
        "display_name": "CanBank User Token Introspect",
        "description": "The access token the console obtains for the logged-in user (aud chatbot-mcp): the bearer token at the first gateway of a workflow, which the gateway sends to whoami and to its admission evaluation.",
        "ikg_node_type": "User",
        "jwt_matcher": {
          "issuer": "https://idsvr.indykite.one/oauth/v2/oauth-anonymous",
          "audience": "chatbot-mcp"
        },
        "claims_mapping": {
          "email": {
            "selector": "email"
          }
        },
        "offline_validation": {},
        "perform_upsert": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
