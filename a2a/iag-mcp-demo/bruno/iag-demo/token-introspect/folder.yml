---
info:
  name: token-introspect
  type: folder
  seq: 2

request:
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{service_token}}"

docs: |-
  The eight Token Introspect configurations of the canbank dataset
  (instant-stack data/canbank manifest.json, token_introspect section), all
  with ikg_node_type User and the same issuer, one per audience: the user
  tokens (indykiteagent-mcp, chatbot-mcp) and the delegated tokens the identity
  provider mints for each gateway (indykiteagent, indykiteagent-2,
  indykiteagent-3, indykiteagent-4, indykiteagent-drive, indykiteagent-erp).
  The platform reads the token a gateway sends in X-IK-Token only through the
  configuration matching its issuer and audience. Service account bearer.
