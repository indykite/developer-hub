---
info:
  name: Millicent (retriever) MCP List Tools
  type: http
  seq: 10

http:
  method: POST
  url: "{{iag_mcp_url}}"
  headers:
    - name: Accept
      value: application/json, text/event-stream
    - name: Content-Type
      value: application/json
    - name: Mcp-Protocol-Version
      value: "2025-11-25"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 2,
        "method": "tools/list",
        "params": {}
      }
  auth:
    type: bearer
    token: "{{user_token_millicent}}"

runtime:
  scripts:
    - type: after-response
      code: |
        var rawBody = res.body;

        // The answer is JSON, or an SSE stream carrying the JSON in its data.
        var jsonData;
        if (typeof rawBody === "string" && rawBody.includes("event:")) {
          var dataMatch = rawBody.match(/data:\s*({.*})/s);
          if (dataMatch) {
            jsonData = JSON.parse(dataMatch[1]);
          }
        } else if (typeof rawBody === "string" && rawBody.trim().startsWith("{")) {
          jsonData = JSON.parse(rawBody);
        } else if (typeof rawBody === "object") {
          jsonData = rawBody;
        }

        // A tools/list gets the capability decision in place of admission:
        // the permitted set of this caller over the chain [indykiteagent-mcp]
        // is empty, and the gateway answers the empty list itself.
        test("Status code is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("The tools list is empty (nothing permitted over a skipped-hop chain)", function () {
          expect(jsonData).to.not.be.undefined;
          expect(jsonData.result).to.have.property("tools");
          expect(jsonData.result.tools).to.be.an("array").that.is.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
