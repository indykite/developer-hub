---
info:
  name: Millicent (retriever) MCP Initialized Notification
  type: http
  seq: 7

http:
  method: POST
  url: "{{iag_mcp_url}}"
  headers:
    - name: Accept
      value: application/json, text/event-stream
    - name: Content-Type
      value: application/json
    - name: Mcp-Protocol-Version
      value: "2025-11-25"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "method": "notifications/initialized",
        "params": {}
      }
  auth:
    type: bearer
    token: "{{user_token_millicent}}"

runtime:
  scripts:
    - type: after-response
      code: |
        // A notification gets the admission decision, like initialize.
        test("Status code is 403 (admission refused)", function () {
          expect(res.status).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
