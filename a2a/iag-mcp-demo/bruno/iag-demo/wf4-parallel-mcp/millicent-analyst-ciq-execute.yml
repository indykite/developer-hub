---
info:
  name: Millicent (analyst) MCP Tool CIQ Execute
  type: http
  seq: 18

http:
  method: POST
  url: "{{iag_mcp_url}}"
  headers:
    - name: Accept
      value: application/json, text/event-stream
    - name: Content-Type
      value: application/json
    - name: Mcp-Protocol-Version
      value: "2025-11-25"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 4,
        "method": "tools/call",
        "params": {
          "name": "ciq_execute",
          "arguments": {
            "id": "{{get_stock_quote_query}}",
            "input_params": {
              "ticker": "NVDA"
            }
          }
        }
      }
  auth:
    type: bearer
    token: "{{user_token_millicent}}"

runtime:
  scripts:
    - type: after-response
      code: |
        var rawBody = res.body;

        // The answer is JSON, or an SSE stream carrying the JSON in its data.
        var jsonData;
        if (typeof rawBody === "string" && rawBody.includes("event:")) {
          var dataMatch = rawBody.match(/data:\s*({.*})/s);
          if (dataMatch) {
            jsonData = JSON.parse(dataMatch[1]);
          }
        } else if (typeof rawBody === "string" && rawBody.trim().startsWith("{")) {
          jsonData = JSON.parse(rawBody);
        } else if (typeof rawBody === "object") {
          jsonData = rawBody;
        }

        // A tools/call gets the capability decision: the tool is outside the
        // (empty) permitted set of the chain [indykiteagent-mcp], so the
        // gateway refuses it and the MCP server is not called.
        test("Status code is 403", function () {
          expect(res.status).to.equal(403);
        });

        test("JSON-RPC error -31403 (the caller may not use the named tool)", function () {
          expect(jsonData).to.not.be.undefined;
          expect(jsonData).to.have.property("error");
          expect(jsonData.error.code).to.equal(-31403);
          expect(jsonData).to.not.have.property("result");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
