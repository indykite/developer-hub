---
info:
  name: Carol (retriever) MCP List Tools
  type: http
  seq: 11

http:
  method: POST
  url: "{{iag_mcp_url}}"
  headers:
    - name: Accept
      value: application/json, text/event-stream
    - name: Content-Type
      value: application/json
    - name: Mcp-Session-Id
      value: "{{wf4_carol_retriever_session_id}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 2,
        "method": "tools/list",
        "params": {}
      }
  auth:
    type: bearer
    token: "{{user_token_carol}}"

runtime:
  scripts:
    - type: after-response
      code: |
        var rawBody = res.body;

        // SSE stream - parse the JSON from the event data
        var jsonData;
        if (typeof rawBody === "string" && rawBody.includes("event:")) {
          var dataMatch = rawBody.match(/data:\s*({.*})/s);
          if (dataMatch) {
            jsonData = JSON.parse(dataMatch[1]);
          }
        } else if (typeof rawBody === "object") {
          jsonData = rawBody;
        }

        test("Status code is 200", function () {
          expect(res.status).to.equal(200);
        });

        test("Response has a tools array with authzen_evaluate and ciq_execute", function () {
          expect(jsonData).to.not.be.null;
          expect(jsonData.result).to.have.property("tools");
          expect(jsonData.result.tools).to.be.an("array");
          var names = jsonData.result.tools.map(function (t) { return t.name; });
          expect(names).to.include("authzen_evaluate");
          expect(names).to.include("ciq_execute");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
