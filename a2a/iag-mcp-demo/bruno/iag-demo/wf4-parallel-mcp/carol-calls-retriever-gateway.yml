---
info:
  name: Carol calls retriever gateway
  type: http
  seq: 2

http:
  method: POST
  url: "{{iag_retriever_url}}/"
  headers:
    - name: Accept
      value: application/json, text/event-stream
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "message/send",
        "params": {
          "message": {
            "messageId": "wf4-carol-retriever",
            "role": "ROLE_USER",
            "parts": [
              {
                "text": "hello from carol to retriever (WF4)"
              }
            ]
          }
        }
      }
  auth:
    type: bearer
    token: "{{user_token_carol}}"

runtime:
  scripts:
    - type: after-response
      code: |
        // The user's token goes straight to the retriever gateway, so the
        // delegation chain is [indykiteagent-2]. No workflow starts at the
        // retriever (wf1 is orchestrator -> retriever -> mcp): admission refuses.
        test("Status code is 403 (no workflow starts at the retriever)", function () {
          expect(res.status).to.equal(403);
        });

        test("Response carries no JSON-RPC result", function () {
          var jsonData = res.body;
          if (typeof jsonData === "string" && jsonData.trim().startsWith("{")) {
            jsonData = JSON.parse(jsonData);
          }
          expect(jsonData || {}).to.not.have.property("result");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
