---
info:
  name: Carol (retriever) MCP Initialize
  type: http
  seq: 5

http:
  method: POST
  url: "{{iag_mcp_url}}"
  headers:
    - name: Accept
      value: application/json, text/event-stream
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "initialize",
        "params": {
          "protocolVersion": "2025-11-25",
          "capabilities": {},
          "clientInfo": {
            "name": "bruno-iag-wf4-carol-retriever",
            "version": "1.0"
          }
        }
      }
  auth:
    type: bearer
    token: "{{user_token_carol}}"

runtime:
  scripts:
    - type: after-response
      code: |
        // The user's token goes straight to the MCP gateway, so the delegation
        // chain is [indykiteagent-mcp]. No workflow starts at the MCP agent:
        // an initialize gets the admission decision and is refused.
        test("Status code is 403 (skipped hops: no workflow starts at the MCP gateway)", function () {
          expect(res.status).to.equal(403);
        });

        test("No MCP session is opened", function () {
          expect(res.headers["mcp-session-id"]).to.be.undefined;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
