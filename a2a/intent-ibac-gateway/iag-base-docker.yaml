---
# Settings every Agent Gateway of the fleet shares. Each gateway in
# docker-compose.yaml extends this service and adds its own name, port, the
# agent it protects and the Auth0 Machine-to-Machine client it is known by.
#
# The image is the latest release published on Docker Hub
# (https://hub.docker.com/r/indykite/agent-gateway/tags), pulled when missing; another tag can be named in .env as AGENT_GATEWAY_IMAGE.
# What this demo relies on: Token Service mode (the delegated token in
# X-IK-Token, nothing in Authorization: the agent never holds the person's
# token); admission as one
# AuthZEN evaluation over the delegation chain ($ik_token.act_chain, policy
# person-can-reach-agent in the intent-ibac dataset); the capability checks
# (the extended card filtered to the CAN_USE Skill set); ibac.enabled, which
# has the gateway ask the Intent Agent about every prompt and answer the caller
# itself when there is no intent; the second exchange with the intent, when the
# gateway and the Token Service both know it; the INTENT audit records with the prompt; and
# the delegated token extension declared on the cards and named in
# A2A-Extensions on every forwarded call. No browser calls a gateway directly
# (the console does, server side), so cors.allowed_origins stays empty.

services:
  iag-base:
    image: ${AGENT_GATEWAY_IMAGE:-indykite/agent-gateway:2.114.0}
    environment:
      JARVIS_SERVICE_LOG_LEVEL: ${IAG_LOG_LEVEL:-info}
      JARVIS_SERVICE_ENVIRONMENT: demo
      JARVIS_SERVICE_TRACING_DETECTOR: local
      # The identity provider is Auth0, through the auth0-bridge service: Auth0
      # publishes no RFC 7662 introspection endpoint and its client-credentials
      # grant needs an audience the gateway does not send, so the bridge answers
      # introspection by verifying the tenant's JWTs offline and forwards the
      # token grant with the agents' audience added. Each gateway authenticates
      # with its own Machine-to-Machine application of the tenant.
      JARVIS_IDENTITY_PROVIDER_BASE_URL: http://auth0-bridge:8090
      JARVIS_IDENTITY_PROVIDER_INTROSPECT_ENDPOINT: oauth/introspect
      JARVIS_IDENTITY_PROVIDER_CLIENT_CREDENTIAL_ENDPOINT: oauth/token
      JARVIS_IDENTITY_PROVIDER_EXCHANGE_ENDPOINT: oauth/token
      JARVIS_IDENTITY_PROVIDER_OPENID_CONFIGURATION_URL: https://${AUTH0_DOMAIN}/.well-known/openid-configuration
      JARVIS_IDENTITY_PROVIDER_ISSUER: https://${AUTH0_DOMAIN}/
      # Token Service mode: the delegated token is minted at the self-hosted
      # IndyKite Token Service with the user's token as subject and the
      # gateway's client token as actor. The client pair must match
      # idp.client_auth in token-service.yaml.
      JARVIS_TOKEN_SERVICE_BASE_URL: http://token-service:8102
      JARVIS_TOKEN_SERVICE_EXCHANGE_ENDPOINT: oauth2/token
      JARVIS_TOKEN_SERVICE_INTROSPECT_ENDPOINT: oauth2/introspect
      JARVIS_TOKEN_SERVICE_CLIENT_AUTH_TYPE: client_secret_basic
      JARVIS_TOKEN_SERVICE_CLIENT_AUTH_CLIENT_ID: intent-ibac
      JARVIS_TOKEN_SERVICE_CLIENT_AUTH_CLIENT_SECRET: ${TOKEN_SERVICE_CLIENT_SECRET}
      # Every delegated token is minted for the agents' audience; the platform
      # reads it in X-IK-Token through the token-service-intent-ibac introspect.
      JARVIS_TOKEN_SERVICE_AUDIENCE: intent-ibac-agents
      # What the agent gets in Authorization next to the delegated token: none
      # here, so the agent holds only the delegated token and cannot replay the
      # person's token to start a new workflow as them. correct_audience (the
      # gateway's default) would pass the person's token on; all, anything sent.
      JARVIS_AUTHORIZATION_HEADER_FORWARD: ${IAG_AUTHORIZATION_FORWARD:-none}
      # A workflow starts with a user's Auth0 access token issued for the people's
      # API: every login is a Person; whoami resolves it to its Person node, and
      # whether that person is staff or a customer is found on the graph.
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_AUDIENCES: ${AUTH0_PEOPLE_AUDIENCE:-ibac-people}
      JARVIS_PROTECTED_AGENT_AUTHENTICATION_TYPE: credentials
      # ContX IQ resolves the caller of every request (whoami); AuthZEN decides
      # admission with one evaluation: subject = whoami, action CAN_TRIGGER,
      # resource = this gateway's own Agent node, the chain in $ik_token.
      JARVIS_CONTX_IQ_BASE_URL: ${INDYKITE_BASE_URL}/contx-iq/v1
      JARVIS_CONTX_IQ_APP_AGENT_CREDENTIALS_TOKEN: ${APP_AGENT_CREDENTIALS_TOKEN}
      JARVIS_AUTHZEN_BASE_URL: ${INDYKITE_BASE_URL}/access/v1
      JARVIS_AUTHZEN_ACTION: CAN_TRIGGER
      # Capability checks (on by default): the authenticated extended card lists
      # only the skills the caller may use, read with one AuthZEN search/resource
      # (action CAN_USE, type Skill, the chain in X-IK-Token) against the
      # person-can-use-skill policy; the filtering is a DISCOVERY audit record.
      JARVIS_AUTHZEN_CAPABILITIES_ENABLED: "true"
      JARVIS_AUTHZEN_CAPABILITIES_ACTION: CAN_USE
      JARVIS_AUTHZEN_CAPABILITIES_LABELS_SKILLS: Skill
      JARVIS_AUTHZEN_CACHE_TTL: ${IAG_AUTHZEN_CACHE_TTL:-30s}
      JARVIS_AUTHZEN_CACHE_UPDATE_AFTER: ${IAG_AUTHZEN_CACHE_TTL:-30s}
      # Intent-Based Access Control: before forwarding a message the gateway
      # sends its prompt to the Intent Agent, with the whoami subject in the
      # message metadata and its own client token for the intent_agent audience.
      JARVIS_IBAC_ENABLED: "true"
      # With the intent in hand the gateway compares it with the x-coaz-mappings of the skills the
      # caller may use on its card: an intent no skill covers refuses the message (403), and the
      # delegated token carries only the evaluations that fit. A skill without a mapping covers every
      # intent with allow (the default) and nothing with deny. The skills and their mappings are kept
      # for the same short time as the card.
      JARVIS_IBAC_CAPABILITIES_UNMAPPED: ${IAG_IBAC_UNMAPPED:-allow}
      JARVIS_IBAC_CAPABILITIES_CACHE_TTL: ${IAG_A2A_CACHE_TTL:-5s}
      JARVIS_INTENT_AGENT_BASE_URL: http://${INTENT_AGENT_ENTRY:-intent-agent}:${INTENT_AGENT_PORT:-6003}
      JARVIS_INTENT_AGENT_AUDIENCE: intent_agent
      JARVIS_INTENT_AGENT_TIMEOUT: ${INTENT_AGENT_TIMEOUT:-45s}
      # The gateway keeps the agent's card (its A2A client) and reads it again
      # in the background after this interval, 5 minutes by default. Kept very
      # short here so an edit to a card in console/data/fleet.json reaches the
      # gateway, and the extended card it filters, within seconds.
      JARVIS_A2A_CACHE_TTL: ${IAG_A2A_CACHE_TTL:-5s}
      JARVIS_A2A_CACHE_UPDATE_AFTER: ${IAG_A2A_CACHE_TTL:-5s}
      JARVIS_A2A_CACHE_UPDATE_AFTER_ERROR: ${IAG_A2A_CACHE_TTL:-5s}
    volumes:
      # Audit: every decision of the gateway lands on the console's webhook,
      # next to the Token Service's and the Intent Agent's records. The file
      # is rendered by `make keys` from audit-config.template.yaml with the
      # webhook key inside (gitignored), because the gateway reads the key
      # from its config file only.
      - ./audit-config.yaml:/app/.configs/audit-config.yaml:ro
    command: ["--config=/app/.configs/audit-config.yaml"]
