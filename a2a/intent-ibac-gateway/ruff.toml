# Inherits the repository-wide rules (select = ALL, line length 120, double
# quotes); only the test suite relaxes what pytest-style code cannot satisfy.
extend = "../../pyproject.toml"

# Keep ruff's import sorting in agreement with the repo's isort hook, which
# files the console's own `app` package and the bridge's `server` module with
# the third-party imports (same arrangement the root config uses for
# instant-stack's `api` package).
[lint.isort]
known-third-party = ["app", "server"]

[lint.per-file-ignores]
"console/tests/*" = [
    "S101",    # pytest asserts
    "S105",    # test fixtures carry literal "secrets"
    "S106",
    "PLR2004", # expected values in assertions are literals by design
    "ANN",     # fixtures and test functions stay unannotated
    "D",       # test names are the documentation
]
"auth0_bridge/tests/*" = [
    "S101",    # pytest asserts
    "S105",    # test fixtures carry literal "secrets" and token types
    "S106",
    "PLR2004", # expected status codes and values are literals by design
    "ANN",     # fixtures and test functions stay unannotated
    "ARG",     # autouse fixtures are requested for their side effect, not their value
    "D",       # test names are the documentation
    "SLF001",  # tests reset the module's private caches
]
